name: Deploy Web (temp, dispatched)

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        id: main-checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Assemble web site
        # web/build.mjs 是纯 Node 脚本，无需 npm install / webpack。
        # 传入空的 --gui 目录：跳过编辑器 webpack bundle 的复制（该 bundle 依赖
        # 本机未提交的 scratch-gui 私有改动，无法在 CI 复现，保留现有部署版本），
        # 但仍会从当前源码重建 gui/gui.html 与 migrate-helper.html。
        run: |
          mkdir -p .keep-gui-empty
          node web/build.mjs --gui .keep-gui-empty --out dist-web --cname neowarp.sy1.top

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Sync site to gh-pages
        # 保留 gui/（编辑器 webpack bundle 维持现有部署版本），其余全部以 main 重建产物替换
        run: |
          cd gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'gui' -exec rm -rf {} +
          cp -a ../dist-web/. .
          git config user.name "Shiyuan-318"
          git config user.email "Shiyuan-318@users.noreply.github.com"
          git add -A
          git commit -m "deploy: 同步 main@${{ steps.main-checkout.outputs.commit }} 的网页版构建产物（编辑器 bundle 保持现有版本）" || echo "nothing to commit"
          git push origin gh-pages
