<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NeoWarp</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a0a0d">
    <style>
      /* ===== 设计令牌（深色默认，浅色主题整体覆盖） ===== */
      :root {
        color-scheme: dark;
        --bg: #0a0a0d;
        --text: #f5f5f7;
        --text-dim: rgba(245, 245, 247, 0.48);
        --text-faint: rgba(245, 245, 247, 0.32);
        --card: rgba(255, 255, 255, 0.045);
        --card-hover: rgba(255, 255, 255, 0.085);
        --card-border: rgba(255, 255, 255, 0.07);
        --card-border-hover: rgba(255, 255, 255, 0.17);
        --accent: #5b8cff;
        --orb-1: rgba(59, 123, 255, 0.55);
        --orb-2: rgba(255, 138, 60, 0.5);
        --orb-opacity: 0.16;
        --glow-opacity: 0.55;
        --logo-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        --hover-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        --brand-grad: linear-gradient(100deg, #e8ecff 20%, #9db8ff 55%, #ffb37a 90%);
        --hero-bg: linear-gradient(135deg, rgba(76, 141, 255, 0.14), rgba(159, 122, 234, 0.08));
        --hero-border: rgba(122, 160, 255, 0.24);
        --hero-border-hover: rgba(140, 170, 255, 0.42);
        --toast-bg: rgba(38, 38, 44, 0.92);
        --toast-border: rgba(255, 255, 255, 0.12);
        --overlay-bg: rgba(0, 0, 0, 0.45);
        --modal-bg: #16161c;
        --modal-border: rgba(255, 255, 255, 0.1);
        --modal-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        --scrollbar: rgba(255, 255, 255, 0.14);
        --focus-ring: rgba(120, 160, 255, 0.6);
        --bg-scrim: rgba(10, 10, 13, 0.5);
        --glass-bg: rgba(28, 28, 30, 0.3);
        --glass-bg-hover: rgba(44, 44, 48, 0.42);
        --glass-bg-strong: rgba(24, 24, 28, 0.55);
        --glass-border: rgba(255, 255, 255, 0.06);
        --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        --tint-blue-bg: rgba(66, 133, 244, 0.16);    --tint-blue-fg: #7aa7ff;
        --tint-green-bg: rgba(52, 199, 123, 0.14);   --tint-green-fg: #5ed697;
        --tint-purple-bg: rgba(159, 122, 234, 0.15); --tint-purple-fg: #bfa2f2;
        --tint-orange-bg: rgba(255, 138, 60, 0.14);  --tint-orange-fg: #ffab6e;
        --tint-pink-bg: rgba(255, 90, 160, 0.14);    --tint-pink-fg: #ff8ab8;
        --tint-teal-bg: rgba(32, 191, 180, 0.14);    --tint-teal-fg: #5ad4c8;
        --tint-indigo-bg: rgba(99, 122, 244, 0.16);  --tint-indigo-fg: #97abff;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f2f2f7;
        --text: #1d1d1f;
        --text-dim: rgba(29, 29, 31, 0.5);
        --text-faint: rgba(29, 29, 31, 0.34);
        --card: rgba(255, 255, 255, 0.65);
        --card-hover: rgba(255, 255, 255, 0.92);
        --card-border: rgba(0, 0, 0, 0.08);
        --card-border-hover: rgba(0, 0, 0, 0.16);
        --accent: #2f6ae0;
        --orb-1: rgba(90, 140, 255, 0.5);
        --orb-2: rgba(255, 160, 90, 0.45);
        --orb-opacity: 0.13;
        --glow-opacity: 0.4;
        --logo-shadow: 0 14px 36px rgba(30, 40, 80, 0.18);
        --hover-shadow: 0 10px 28px rgba(30, 30, 60, 0.12);
        --brand-grad: linear-gradient(100deg, #1d1d1f 20%, #3b5bdb 55%, #d97427 90%);
        --hero-bg: linear-gradient(135deg, rgba(76, 141, 255, 0.1), rgba(159, 122, 234, 0.06));
        --hero-border: rgba(76, 141, 255, 0.22);
        --hero-border-hover: rgba(76, 141, 255, 0.38);
        --toast-bg: rgba(255, 255, 255, 0.95);
        --toast-border: rgba(0, 0, 0, 0.1);
        --overlay-bg: rgba(30, 30, 60, 0.28);
        --modal-bg: #ffffff;
        --modal-border: rgba(0, 0, 0, 0.08);
        --modal-shadow: 0 24px 70px rgba(30, 30, 60, 0.22);
        --scrollbar: rgba(0, 0, 0, 0.16);
        --focus-ring: rgba(60, 110, 240, 0.55);
        --bg-scrim: rgba(242, 242, 247, 0.45);
        --glass-bg: rgba(255, 255, 255, 0.38);
        --glass-bg-hover: rgba(255, 255, 255, 0.52);
        --glass-bg-strong: rgba(255, 255, 255, 0.62);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: 0 8px 32px rgba(30, 30, 60, 0.16);
        --tint-blue-bg: rgba(66, 133, 244, 0.12);    --tint-blue-fg: #3b6fe0;
        --tint-green-bg: rgba(52, 199, 123, 0.12);   --tint-green-fg: #248a3d;
        --tint-purple-bg: rgba(159, 122, 234, 0.12); --tint-purple-fg: #7d55c7;
        --tint-orange-bg: rgba(255, 138, 60, 0.14);  --tint-orange-fg: #c77017;
        --tint-pink-bg: rgba(255, 90, 160, 0.12);    --tint-pink-fg: #d84a8f;
        --tint-teal-bg: rgba(32, 191, 180, 0.12);    --tint-teal-fg: #0f9488;
        --tint-indigo-bg: rgba(99, 122, 244, 0.12);  --tint-indigo-fg: #4c63d2;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        transition: background 0.3s ease, color 0.3s ease;
      }

      /* ===== 环境光背景 ===== */
      .ambient {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .ambient::before,
      .ambient::after {
        content: "";
        position: absolute;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(90px);
        opacity: var(--orb-opacity);
      }
      .ambient::before {
        top: -25vmax;
        left: -18vmax;
        background: radial-gradient(circle, var(--orb-1) 0%, transparent 65%);
        animation: orb-drift 18s ease-in-out infinite alternate;
      }
      .ambient::after {
        bottom: -28vmax;
        right: -15vmax;
        background: radial-gradient(circle, var(--orb-2) 0%, transparent 65%);
        animation: orb-drift 22s ease-in-out infinite alternate-reverse;
      }
      @keyframes orb-drift {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(4vmax, 3vmax) scale(1.08); }
      }

      /* ===== 自定义背景图（覆盖环境光背景） ===== */
      body.custom-bg .ambient { display: none; }
      .bg-image {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .bg-image:not([hidden]) {
        animation: bg-in 0.5s ease;
      }
      @keyframes bg-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .bg-scrim {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: var(--bg-scrim);
        pointer-events: none;
        transition: background 0.3s ease;
      }

      .container {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(56px, 9vw, 120px);
        padding: 32px 48px;
        overflow-y: auto;
      }
      .container::-webkit-scrollbar { width: 8px; }
      .container::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: 4px;
      }

      /* ===== 入场动画 ===== */
      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .brand {
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .panel > * {
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .panel > :nth-child(1) { animation-delay: 0.06s; }
      .panel > :nth-child(2) { animation-delay: 0.12s; }
      .panel > :nth-child(3) { animation-delay: 0.18s; }

      /* ===== 左侧品牌区 ===== */
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        flex-shrink: 0;
      }
      .logo-wrap {
        position: relative;
        width: 190px;
        height: 190px;
      }
      .logo-wrap::before {
        content: "";
        position: absolute;
        inset: -30px;
        border-radius: 50%;
        background: conic-gradient(from 210deg,
          rgba(59, 123, 255, 0.35),
          rgba(255, 138, 60, 0.35),
          rgba(59, 123, 255, 0.35));
        filter: blur(38px);
        opacity: var(--glow-opacity);
        animation: glow-drift 9s ease-in-out infinite alternate;
      }
      @keyframes glow-drift {
        from { transform: rotate(-8deg) scale(1); }
        to   { transform: rotate(10deg) scale(1.07); }
      }
      .logo-wrap img {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: var(--logo-shadow);
      }
      /* Logo 内容（默认图片 / 自定义图片 / 自定义 HTML）切入动画 */
      @keyframes logo-pop {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }
      .logo-wrap > img,
      .logo-wrap > .custom-logo {
        animation: logo-pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: 0.1s;
      }
      .brand-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1.5px;
        background: var(--brand-grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brand-name.swap {
        animation: brand-in 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes brand-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .brand-version {
        font-size: 12.5px;
        color: var(--text-faint);
        letter-spacing: 0.5px;
        padding: 3px 12px;
        border: 1px solid var(--card-border);
        border-radius: 999px;
      }
      .brand-version[hidden] { display: none; }

      /* 自定义 HTML Logo 的 Shadow 宿主：位于光晕之上、占满 Logo 区域 */
      .logo-wrap .custom-logo {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }

      /* ===== 右侧面板 ===== */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 26px;
        width: 560px;
        max-width: 100%;
      }
      .panel-header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #greeting {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      #date-line {
        font-size: 14px;
        color: var(--text-dim);
        letter-spacing: 0.5px;
      }

      /* ===== 操作按钮 ===== */
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      /* 两个相关动作并排成一行，节省纵向空间 */
      .buttons-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .menu-button {
        appearance: none;
        border: 1px solid var(--card-border);
        outline: none;
        position: relative;
        width: 100%;
        padding: 15px 18px;
        border-radius: 16px;
        background: var(--card);
        backdrop-filter: blur(12px);
        color: var(--text);
        font-family: inherit;
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease,
                    transform 0.15s ease, box-shadow 0.18s ease;
      }
      .menu-button:hover {
        background: var(--card-hover);
        border-color: var(--card-border-hover);
        transform: translateY(-2px);
        box-shadow: var(--hover-shadow);
      }
      .menu-button:active {
        transform: translateY(0) scale(0.99);
        box-shadow: none;
      }
      .menu-button:focus-visible {
        border-color: var(--focus-ring);
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
      .btn-icon {
        flex-shrink: 0;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.18s ease;
      }
      .menu-button:hover .btn-icon {
        transform: scale(1.08);
      }
      .btn-icon svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-blue   { background: var(--tint-blue-bg);   color: var(--tint-blue-fg); }
      .icon-green  { background: var(--tint-green-bg);  color: var(--tint-green-fg); }
      .icon-purple { background: var(--tint-purple-bg); color: var(--tint-purple-fg); }
      .icon-orange { background: var(--tint-orange-bg); color: var(--tint-orange-fg); }
      .icon-pink   { background: var(--tint-pink-bg);   color: var(--tint-pink-fg); }
      .icon-teal   { background: var(--tint-teal-bg);   color: var(--tint-teal-fg); }
      .icon-indigo { background: var(--tint-indigo-bg); color: var(--tint-indigo-fg); }
      .btn-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .btn-title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .btn-desc {
        font-size: 12.5px;
        color: var(--text-dim);
        letter-spacing: 0.3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .btn-arrow {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--text-faint);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.18s ease, stroke 0.18s ease;
      }
      .menu-button:hover .btn-arrow {
        transform: translateX(4px);
        stroke: var(--text-dim);
      }

      /* SOLO 主按钮：略微突出 */
      .btn-hero {
        padding: 16px 20px;
        background-image: var(--hero-bg);
        border-color: var(--hero-border);
      }
      .btn-hero:hover {
        border-color: var(--hero-border-hover);
      }

      /* 并排按钮：紧凑尺寸，隐藏箭头给文字留空间 */
      .buttons-pair .menu-button {
        padding: 12px 14px;
        gap: 12px;
      }
      .buttons-pair .btn-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
      }
      .buttons-pair .btn-title {
        font-size: 14.5px;
      }
      .buttons-pair .btn-desc {
        font-size: 12px;
      }
      .buttons-pair .btn-arrow {
        display: none;
      }

      /* ===== 最近项目 ===== */
      .recent {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .recent[hidden] { display: none; }
      .recent-title {
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--text-faint);
        padding-left: 4px;
      }
      .recent-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 168px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .recent-list::-webkit-scrollbar { width: 6px; }
      .recent-list::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: 3px;
      }
      .recent-item {
        appearance: none;
        border: 1px solid var(--card-border);
        outline: none;
        position: relative;
        width: 100%;
        flex-shrink: 0;
        padding: 9px 14px;
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font-family: inherit;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease,
                    transform 0.12s ease, box-shadow 0.15s ease;
      }
      .recent-item:hover {
        background: var(--card-hover);
        border-color: var(--card-border-hover);
        transform: translateY(-1px);
      }
      .recent-item:active {
        transform: translateY(0) scale(0.99);
      }
      .recent-item:focus-visible {
        border-color: var(--focus-ring);
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
      .recent-badge {
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .recent-badge svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .recent-icon-scratch { background: var(--tint-green-bg);  color: var(--tint-green-fg); }
      .recent-icon-js      { background: var(--tint-purple-bg); color: var(--tint-purple-fg); }
      .recent-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .recent-name {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recent-path {
        font-size: 11.5px;
        color: var(--text-faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ===== 右下角圆形按钮 ===== */
      #github-button,
      #settings-button {
        position: fixed;
        z-index: 2;
        bottom: 26px;
        width: 46px;
        height: 46px;
        border: 1px solid var(--card-border);
        border-radius: 50%;
        background: var(--card);
        backdrop-filter: blur(12px);
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s ease,
                    color 0.15s ease, border-color 0.15s ease, transform 0.2s ease;
      }
      #github-button { right: 84px; }
      #settings-button { right: 26px; }
      #github-button:hover,
      #settings-button:hover {
        background: var(--card-hover);
        border-color: var(--card-border-hover);
        color: var(--text);
        transform: translateY(-2px);
      }
      #settings-button:hover {
        transform: rotate(40deg);
      }
      #github-button:focus-visible,
      #settings-button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
      #github-button svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      #settings-button svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      /* ===== 提示气泡 ===== */
      #toast {
        position: fixed;
        z-index: 3;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%) translateY(20px);
        background: var(--toast-bg);
        backdrop-filter: blur(14px);
        color: var(--text);
        border: 1px solid var(--toast-border);
        border-radius: 999px;
        padding: 12px 26px;
        font-size: 14.5px;
        letter-spacing: 0.3px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        box-shadow: var(--hover-shadow);
        max-width: 80%;
        text-align: center;
      }
      #toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ===== 发起协作选择弹窗 ===== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--overlay-bg);
        backdrop-filter: blur(8px);
      }
      .modal-overlay.open { display: flex; }
      .collab-card {
        width: 420px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 26px 24px 20px;
        border-radius: 22px;
        border: 1px solid var(--modal-border);
        background: var(--modal-bg);
        box-shadow: var(--modal-shadow);
        animation: modal-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes modal-in {
        from { opacity: 0; transform: translateY(16px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      .collab-card-header {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 8px;
      }
      .collab-card-header h2 {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .collab-card-header p {
        margin: 0;
        font-size: 13px;
        color: var(--text-dim);
        letter-spacing: 0.3px;
      }

        appearance: none;
        border: none;

        padding: 11px;
        border-radius: 13px;
        background: transparent;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .collab-cancel:hover {

        color: var(--text);
      }
      .collab-cancel:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      /* ===== 自定义背景：液态玻璃 =====
         折射算法与 SyServer 官网导航栏一致（复刻 Kyant0/AndroidLiquidGlass，
         位移贴图按 RoundedRectRefraction 逐像素烘焙）。
         Chromium 不渲染 backdrop-filter: url(#svg)（实验证实），因此按钮本身
         只画细边框/外投影，模糊与折射由 JS 注入的 .lg-glass 子层承担：
         .lg-lens 对与页面背景逐像素对齐的副本施加元素级 filter
         saturate() blur() url(#位移滤镜)，.lg-veil 补偿页面蒙层，
         .lg-tint 提供玻璃底色（hover 加亮）。 */
      body.custom-bg .menu-button,
      body.custom-bg .recent-item,
      body.custom-bg #github-button,
      body.custom-bg #settings-button {
        background: var(--glass-bg);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-color: var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      body.custom-bg .menu-button:hover,
      body.custom-bg .recent-item:hover,
      body.custom-bg #github-button:hover,
      body.custom-bg #settings-button:hover {
        background: var(--glass-bg-hover);
      }
      body.custom-bg .menu-button > *,
      body.custom-bg .recent-item > *,
      body.custom-bg #github-button > svg,
      body.custom-bg #settings-button > svg {
        position: relative;
        z-index: 1;
      }
      /* 玻璃子层：副本折射 + 蒙层补偿 + 玻璃底色 */
      body.custom-bg .lg-glass {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      body.custom-bg .lg-lens {
        position: absolute;
        inset: 0;
        /* filter（saturate -> blur -> url 位移）由 JS 按几何挂上 */
      }
      body.custom-bg .lg-replica {
        position: absolute;
        /* 几何由 JS 与页面背景逐像素对齐 */
      }
      body.custom-bg .lg-veil {
        position: absolute;
        inset: 0;
        background: var(--bg-scrim);
      }
      body.custom-bg .lg-tint {
        position: absolute;
        inset: 0;
        background: var(--glass-bg);
        transition: background 0.18s ease;
      }
      body.custom-bg .menu-button:hover .lg-tint,
      body.custom-bg .recent-item:hover .lg-tint,
      body.custom-bg #github-button:hover .lg-tint,
      body.custom-bg #settings-button:hover .lg-tint {
        background: var(--glass-bg-hover);
      }
      /* 罕见兜底：不支持元素级 SVG 滤镜时退化为纯 backdrop 模糊 */
      body.custom-bg .lg-glass i {
        position: absolute;
        inset: 0;
        display: block;
        backdrop-filter: blur(10px) saturate(165%);
        -webkit-backdrop-filter: blur(10px) saturate(165%);
      }
      /* SOLO 主按钮在玻璃上保留强调色渐变 */
      body.custom-bg .btn-hero {
        background-image: var(--hero-bg);
      }
      /* 弹窗卡片：所在叠加层已模糊背景，用更实的玻璃底色即可（不再嵌套 backdrop-filter） */
      body.custom-bg .collab-card {
        background: var(--glass-bg-strong);
        border-color: var(--glass-border);
      }
      /* 不支持 backdrop-filter 时加深底色保证可读 */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        body.custom-bg {
          --glass-bg: rgba(28, 28, 30, 0.88);
          --glass-bg-hover: rgba(40, 40, 44, 0.92);
          --glass-bg-strong: rgba(28, 28, 30, 0.94);
        }
      }

      const strings = STRINGS[lang];

      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

      // ===== 主题（浅色/深色，跟随桌面设置） =====
      const applyTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
        HomePreload.themeApplied(theme === 'light' ? 'light' : 'dark');

      // ===== 液态玻璃引擎 =====
      // 折射算法与 SyServer 官网一致（复刻 Kyant0/AndroidLiquidGlass 的
      // RoundedRectRefraction）：把 d*grad 逐像素烘成 RG 位移贴图
      // （R=X 位移，G=Y 位移，128 表示不位移），交给 SVG feDisplacementMap。
      //
      // 与 SyServer 的关键差异：实验证实 Chromium 会解析但不渲染
      // backdrop-filter: url(#svg)（CSS.supports 仍返回 true，无法探测），
      // 因此折射不挂在 backdrop-filter 上，而是走「背景副本」：
      // 玻璃层内放一个与页面背景逐像素对齐的副本图，对副本施加元素级
      // filter: saturate() blur() url(#位移滤镜) —— 元素级 SVG 滤镜渲染正常。
      // 按钮多个且尺寸各异，位移贴图按量化几何（宽x高x圆角）缓存，
      // 同一几何的按钮共享一个 SVG 滤镜。
      const LG_SVG_NS = 'http://www.w3.org/2000/svg';

      // 可调参数（与 SyServer 导航栏一致）
      const LG_P = {
        blur: 10,             // 模糊半径 px
        sat: 165,             // 饱和度 %
        refractHeight: 29,    // 折射带宽度 px（原库 refractionHeight）
        refractAmount: 76     // 折射位移强度 px（原库 refractionAmount）
      };

      // 元素级 filter: url(#...) 支持（Chromium 始终支持）
      const lgFilterOk = (function () {
        if (!(window.CSS && CSS.supports)) return false;
        return CSS.supports('filter', 'url(#a)');
      })();

      // 圆角矩形 SDF 及其梯度，与 AGSL 版一一对应
      function lgSdRoundedRect(x, y, hw, hh, r) {
        const cx = Math.abs(x) - (hw - r);
        const cy = Math.abs(y) - (hh - r);
        const mx = Math.max(cx, 0), my = Math.max(cy, 0);
        return Math.sqrt(mx * mx + my * my) - r + Math.min(Math.max(cx, cy), 0);
      }

      function lgGradSdRoundedRect(x, y, hw, hh, r) {
        const cx = Math.abs(x) - (hw - r);
        const cy = Math.abs(y) - (hh - r);
        const sx = x < 0 ? -1 : 1, sy = y < 0 ? -1 : 1;
        if (cx >= 0 || cy >= 0) {
          const mx = Math.max(cx, 0), my = Math.max(cy, 0);
          const L = Math.sqrt(mx * mx + my * my) || 1;
          return [sx * mx / L, sy * my / L];
        }
        const gx = cy <= cx ? 1 : 0;   // step(cy, cx)
        return [sx * gx, sy * (1 - gx)];
      }

      function lgCircleMap(x) {
        return 1 - Math.sqrt(Math.max(0, 1 - x * x));
      }

      // 贴图缓存：同一组量化尺寸只烘一次
      const lgCache = {};
      const lgCacheKeys = [];
      function lgCached(key, make) {
        if (lgCache[key]) return lgCache[key];
        const url = make();
        lgCache[key] = url;
        lgCacheKeys.push(key);
        while (lgCacheKeys.length > 60) {
          delete lgCache[lgCacheKeys.shift()];
        }
        return url;
      }

      // 位移贴图：R=X 位移，G=Y 位移，128 = 不位移
      function lgBuildLensMap(w, h, radius, height, amount) {
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        const img = ctx.createImageData(w, h), data = img.data;
        const hw = w / 2, hh = h / 2;
        const gradRadius = Math.min(radius * 1.5, Math.min(hw, hh));

        for (let py = 0; py < h; py++) {
          for (let px = 0; px < w; px++) {
            const x = px + 0.5 - hw, y = py + 0.5 - hh;
            const dist = -lgSdRoundedRect(x, y, hw, hh, radius);  // 内侧为正
            let dx = 0, dy = 0;
            if (dist < height && dist > 0) {
              const d = lgCircleMap(1 - dist / height) * amount;
              const g = lgGradSdRoundedRect(x, y, hw, hh, gradRadius);
              const gl = Math.sqrt(g[0] * g[0] + g[1] * g[1]) || 1;
              // feDisplacementMap 的 scale 会把 [0,1] 还原成像素，
              // 所以这里存的是归一化后的位移量
              dx = (g[0] / gl) * d / amount;
              dy = (g[1] / gl) * d / amount;
            }
            const i = (py * w + px) * 4;
            data[i]     = Math.max(0, Math.min(255, Math.round(128 + dx * 127)));
            data[i + 1] = Math.max(0, Math.min(255, Math.round(128 + dy * 127)));
            data[i + 2] = 128;
            data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        return cv.toDataURL();
      }

      // SVG feDisplacementMap 滤镜：同一量化几何共享一个滤镜实例
      let lgSvgHost = null;
      function lgEnsureFilter(id) {
        if (!lgSvgHost) {
          lgSvgHost = document.createElementNS(LG_SVG_NS, 'svg');
          lgSvgHost.setAttribute('aria-hidden', 'true');
          lgSvgHost.style.cssText =
            'position:absolute;width:0;height:0;overflow:hidden';
          document.body.appendChild(lgSvgHost);
        }
        const existing = lgSvgHost.querySelector('#' + id);
        if (existing) {
          return {
            feImage: existing.querySelector('feImage'),
            feDisp: existing.querySelector('feDisplacementMap')
          };
        }
        const filter = document.createElementNS(LG_SVG_NS, 'filter');
        filter.setAttribute('id', id);
        filter.setAttribute('color-interpolation-filters', 'sRGB');
        filter.setAttribute('x', '0');
        filter.setAttribute('y', '0');
        filter.setAttribute('width', '100%');
        filter.setAttribute('height', '100%');
        filter.setAttribute('primitiveUnits', 'userSpaceOnUse');

        const feImage = document.createElementNS(LG_SVG_NS, 'feImage');
        feImage.setAttribute('result', 'dmap');
        feImage.setAttribute('preserveAspectRatio', 'none');
        feImage.setAttribute('x', '0');
        feImage.setAttribute('y', '0');

        const feDisp = document.createElementNS(LG_SVG_NS, 'feDisplacementMap');
        feDisp.setAttribute('in', 'SourceGraphic');
        feDisp.setAttribute('in2', 'dmap');
        feDisp.setAttribute('xChannelSelector', 'R');
        feDisp.setAttribute('yChannelSelector', 'G');

        filter.appendChild(feImage);
        filter.appendChild(feDisp);
        lgSvgHost.appendChild(filter);
        return { feImage: feImage, feDisp: feDisp };
      }

      function lgSetLensImage(parts, url, w, h, amount) {
        parts.feImage.setAttribute('href', url);
        parts.feImage.setAttributeNS(
          'http://www.w3.org/1999/xlink', 'xlink:href', url);
        parts.feImage.setAttribute('width', w);
        parts.feImage.setAttribute('height', h);
        parts.feDisp.setAttribute('scale', amount);
      }

      const LG_SELECTOR = '.menu-button, .recent-item, #github-button, #settings-button';
      let lgObserver = null;

      function lgApply(el) {
        const glass = el._lgGlass;
        if (!glass) return;
        const rect = glass.getBoundingClientRect();
        const w = Math.round(rect.width), h = Math.round(rect.height);
        if (w < 8 || h < 8) return;
        const lens = glass.querySelector('.lg-lens');
        const replica = glass.querySelector('.lg-replica');
        if (!lgFilterOk || !lens) return;

        // 尺寸量化后配合缓存，几何没跨过台阶时不重烘贴图
        const qw = Math.max(8, Math.round(w / 4) * 4);
        const qh = Math.max(8, Math.round(h / 2) * 2);
        const rawR = parseFloat(getComputedStyle(glass).borderTopLeftRadius) || 0;
        // 圆角不超过短边的一半（50% 圆角在此处已是像素值）
        const r = Math.min(rawR, Math.min(qw, qh) / 2);
        const qr = Math.round(r / 2) * 2;

        const key = qw + 'x' + qh + 'r' + qr;
        if (el._lgKey !== key) {
          el._lgKey = key;
          // 折射带不超过圆角半径，否则角上会出现不连续
          const height = Math.min(LG_P.refractHeight, Math.max(1, qr || LG_P.refractHeight));
          const amount = LG_P.refractAmount;
          const filterId = 'nwGlass-' + key;
          const parts = lgEnsureFilter(filterId);
          const url = lgCached('lens|' + key + '|' + height + '|' + amount, function () {
            return lgBuildLensMap(qw, qh, qr, height, amount);
          });
          lgSetLensImage(parts, url, qw, qh, amount);
          // 顺序遵循原库：color filter -> blur -> lens（折射最后）
          lens.style.filter = 'saturate(' + LG_P.sat + '%) blur(' + LG_P.blur +
                              'px) url(#' + filterId + ')';
        }
        lgAlignReplica(replica, rect);
      }

      // 副本与页面背景（fixed + object-fit: cover）逐像素对齐：
      // 按 cover 公式算出图片的显示尺寸与偏移，再换算到按钮坐标系
      function lgAlignReplica(replica, rect) {
        if (!bgImage || !bgImage.naturalWidth) return;
        if (replica.getAttribute('src') !== bgImage.src) {
          replica.src = bgImage.src;
        }
        const W = window.innerWidth, H = window.innerHeight;
        const iw = bgImage.naturalWidth, ih = bgImage.naturalHeight;
        const s = Math.max(W / iw, H / ih);
        const dw = iw * s, dh = ih * s;
        const ox = (W - dw) / 2, oy = (H - dh) / 2;
        replica.style.left = (ox - rect.left) + 'px';
        replica.style.top = (oy - rect.top) + 'px';
        replica.style.width = dw + 'px';
        replica.style.height = dh + 'px';
      }

      function lgAttach(el) {
        if (el._lgGlass) return;
        const glass = document.createElement('span');
        glass.className = 'lg-glass';
        glass.setAttribute('aria-hidden', 'true');
        if (!lgFilterOk) {
          // 罕见兜底：不支持元素级 SVG 滤镜时退化为纯 backdrop 模糊
          glass.appendChild(document.createElement('i'));
        } else {
          const lens = document.createElement('span');
          lens.className = 'lg-lens';                       // 折射 + 模糊
          const replica = document.createElement('img');
          replica.className = 'lg-replica';
          replica.alt = '';
          replica.draggable = false;
          lens.appendChild(replica);
          glass.appendChild(lens);
        }
        const veil = document.createElement('span');        // 补偿页面蒙层
        veil.className = 'lg-veil';
        glass.appendChild(veil);
        const tint = document.createElement('span');        // 玻璃底色
        tint.className = 'lg-tint';
        glass.appendChild(tint);
        // 插到最前面，位于按钮文字/图标之下
        el.insertBefore(glass, el.firstChild);
        el._lgGlass = glass;
        if (!lgObserver) {
          lgObserver = new ResizeObserver(function (entries) {
            for (const entry of entries) lgApply(entry.target);
          });
        }
        lgObserver.observe(el);
        lgApply(el);
      }

      function lgDetach(el) {
        if (!el._lgGlass) return;
        el._lgGlass.remove();
        delete el._lgGlass;
        delete el._lgKey;
        if (lgObserver) lgObserver.unobserve(el);
      }

      // 视口/滚动/背景加载后重对齐。对齐只是每按钮一次 getBoundingClientRect
      // 加几个乘法，直接同步执行（不依赖 rAF：窗口失焦等场景下 rAF 会被冻结）
      function lgScheduleAlign() {
        for (const el of document.querySelectorAll(LG_SELECTOR)) {
          if (el._lgGlass) lgApply(el);
        }
      }
      window.addEventListener('resize', lgScheduleAlign);
      document.querySelector('.container').addEventListener('scroll', lgScheduleAlign);

      // 依当前是否自定义背景，为所有玻璃目标挂上/摘除液态玻璃
      function updateLiquidGlass() {
        const withGlass = document.body.classList.contains('custom-bg');
        for (const el of document.querySelectorAll(LG_SELECTOR)) {
          if (withGlass) {
            lgAttach(el);
          } else {
            lgDetach(el);
          }
        }
      }

      // ===== 品牌（Logo 与标题文字，跟随桌面设置） =====
      // 自定义 HTML Logo 在 Shadow DOM 中渲染：
      // - 其中的 <style> 只作用于 Logo 本身，不会影响主页其它部分；
      // - 主页的样式也不会渗入 Logo，保证自定义内容的还原度；
      // - 出于安全考虑，其中的 <script> 不会执行（静态展示，与图片 Logo 一致）。
      const LOGO_SHADOW_BASE_STYLE =
        ':host {' +
        '  display: flex;' +
        '  align-items: center;' +
        '  justify-content: center;' +
        '  width: 100%;' +
        '  height: 100%;' +
        '  contain: layout;' +
        '}' +
        ':host > * { max-width: 100%; max-height: 100%; }';

      const logoWrap = document.getElementById('logo-wrap');
      const brandName = document.getElementById('brand-name');
      const brandVersion = document.getElementById('brand-version');

      if (info.version) {
        brandVersion.textContent = 'v' + info.version;
        brandVersion.hidden = false;
      }

      const applyBranding = (logo, text) => {
        const name = text || 'NeoWarp';
        if (brandName.textContent !== name) {
          brandName.textContent = name;
          // 重新播放文字切换动画
          brandName.classList.remove('swap');
          void brandName.offsetWidth;
          brandName.classList.add('swap');
        }
        if (logo && /^data:image/i.test(logo)) {
          logoWrap.innerHTML = '';
          const img = document.createElement('img');
          img.alt = '';
          img.draggable = false;
          img.src = logo;
          logoWrap.appendChild(img);
        } else if (logo) {
          // 自定义 HTML 片段：注入 Shadow DOM，样式互不干扰
          logoWrap.innerHTML = '';
          const host = document.createElement('div');
          host.className = 'custom-logo';
          logoWrap.appendChild(host);
          const shadowRoot = host.attachShadow({ mode: 'open' });
          shadowRoot.innerHTML = '<style>' + LOGO_SHADOW_BASE_STYLE + '</style>' + logo;
          // 阻止自定义 HTML 中的链接把主页窗口导航走
          host.addEventListener('click', (event) => {
            if (event.defaultPrevented) return;
            const anchor = event.composedPath().find((node) => node instanceof HTMLAnchorElement);
            if (anchor) event.preventDefault();
          });
        } else {
          logoWrap.innerHTML = '<img src="logo.png" alt="NeoWarp" draggable="false">';
        }
      };
      applyBranding(info.homeLogo, info.homeLogoText);

      // ===== 自定义背景图（启用液态玻璃按钮效果） =====
      const bgImage = document.getElementById('bg-image');
      const bgScrim = document.getElementById('bg-scrim');
      const applyBackground = (background) => {
        if (background) {
          bgImage.onload = lgScheduleAlign;
          bgImage.src = background;
          bgImage.hidden = false;
          bgScrim.hidden = false;
          document.body.classList.add('custom-bg');
        } else {
          bgImage.removeAttribute('src');
          bgImage.hidden = true;
          bgScrim.hidden = true;
          document.body.classList.remove('custom-bg');
        }
        updateLiquidGlass();
      };
      applyBackground(info.homeBackground);

      HomePreload.onBrandingChanged((data) => {
        applyBranding(data && data.logo, data && data.text);
        applyBackground(data && data.background);
      });

      // ===== 问候语与日期 =====
      const greetingEl = document.getElementById('greeting');
      const dateLine = document.getElementById('date-line');

      function pickGreeting() {
        const hour = new Date().getHours();
        let result = GREETINGS[0];
        for (const greeting of GREETINGS) {
          if (greeting.from <= hour) {
            result = greeting;
          }
        }
        return result[lang] || result.zh;
      }

      function formatDate() {
        const now = new Date();
        if (lang === 'zh') {
          const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
          return (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' + weekdays[now.getDay()];
        }
        return now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      }

      const updateHeader = () => {
        greetingEl.textContent = pickGreeting();
        dateLine.textContent = formatDate();
      };
      updateHeader();
      setInterval(updateHeader, 30 * 1000);

      // ===== 填充按钮与文案 =====
      function fillButton(id, title, desc) {
        const button = document.getElementById(id);
        button.querySelector('.btn-title').textContent = title;
        button.querySelector('.btn-desc').textContent = desc;
      }

      fillButton('btn-solo', strings.solo, strings.soloDesc);
      fillButton('btn-new-scratch', strings.newScratch, strings.newScratchDesc);
      fillButton('btn-new-extension', strings.newExtension, strings.newExtensionDesc);
      fillButton('btn-open-file', strings.openFile, strings.openFileDesc);
      fillButton('btn-image-editor', strings.imageEditor, strings.imageEditorDesc);
      fillButton('btn-collab-host', strings.collabHost, strings.collabHostDesc);
      fillButton('btn-collab-join', strings.collabJoin, strings.collabJoinDesc);
      fillButton('btn-collab-open-file', strings.collabOpenFile, strings.collabOpenFileDesc);
      fillButton('btn-collab-new', strings.collabNew, strings.collabNewDesc);
      document.getElementById('collab-modal-title').textContent = strings.collabModalTitle;
      document.getElementById('collab-modal-subtitle').textContent = strings.collabModalSubtitle;
      document.getElementById('btn-collab-cancel').textContent = strings.cancel;
      const githubButton = document.getElementById('github-button');
      const settingsButton = document.getElementById('settings-button');
      githubButton.title = strings.github;
      githubButton.setAttribute('aria-label', strings.github);
      settingsButton.title = strings.settings;
      settingsButton.setAttribute('aria-label', strings.settings);

      // ===== 提示气泡 =====
      const toast = document.getElementById('toast');
      let toastTimer = null;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('visible');
        }, 2600);
      }

      // ===== 最近项目 =====
      const ICON_SCRATCH = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>';
      const ICON_JS = '<svg viewBox="0 0 24 24"><path d="M8 6 3 12l5 6"/><path d="M16 6l5 6-5 6"/></svg>';
      const recentSection = document.getElementById('recent-section');
      const recentList = document.getElementById('recent-list');
      document.getElementById('recent-title').textContent = strings.recent;

      function renderRecent() {
        HomePreload.getRecentProjects().then((data) => {
          if (!data || !data.show || !data.projects || !data.projects.length) {
            recentSection.hidden = true;
            recentList.textContent = '';
            return;
          }
          recentSection.hidden = false;
          recentList.textContent = '';
          for (const project of data.projects) {
            const row = document.createElement('button');
            row.type = 'button';
            row.className = 'recent-item';
            row.title = project.path;
            const badge = document.createElement('span');
            badge.className = 'recent-badge ' + (project.type === 'extension' ? 'recent-icon-js' : 'recent-icon-scratch');
            badge.innerHTML = project.type === 'extension' ? ICON_JS : ICON_SCRATCH;
            const text = document.createElement('span');
            text.className = 'recent-text';
            const name = document.createElement('span');
            name.className = 'recent-name';
            name.textContent = project.name;
            const itemPath = document.createElement('span');
            itemPath.className = 'recent-path';
            itemPath.textContent = project.path;
            text.appendChild(name);
            text.appendChild(itemPath);
            row.appendChild(badge);
            row.appendChild(text);
            row.addEventListener('click', () => {
              HomePreload.openRecentProject(project.path).then((result) => {
                if (result === 'not-found') {
                  showToast(strings.recentMissing);
                  renderRecent();
                }
              });
            });
            recentList.appendChild(row);
          }
          updateLiquidGlass();
        });
      };
      renderRecent();
      HomePreload.onRecentChanged(renderRecent);

      // ===== 按钮动作 =====
      document.getElementById('btn-solo').addEventListener('click', () => {
        HomePreload.openSolo();
      });

      document.getElementById('btn-new-scratch').addEventListener('click', () => {
        HomePreload.newScratchProject();
      });

      document.getElementById('btn-new-extension').addEventListener('click', () => {
        HomePreload.newExtension();
      });

      document.getElementById('btn-open-file').addEventListener('click', () => {
        HomePreload.openFromFile();
      });

      document.getElementById('btn-image-editor').addEventListener('click', () => {
        HomePreload.openImageEditor();
      });

      // ===== 发起协作 / 加入协作 =====
      const collabModal = document.getElementById('collab-modal');

      function showCollabModal() {
        collabModal.classList.add('open');
        // 弹窗按钮此前 display:none，打开时立即为其烘焙玻璃
        updateLiquidGlass();
        document.getElementById('btn-collab-open-file').focus();
      }

      function hideCollabModal() {
        collabModal.classList.remove('open');
      }

      document.getElementById('btn-collab-host').addEventListener('click', showCollabModal);

      document.getElementById('btn-collab-join').addEventListener('click', () => {
        HomePreload.openCollabJoin();
      });

      document.getElementById('btn-collab-open-file').addEventListener('click', () => {
        hideCollabModal();
        HomePreload.openCollabHostFromFile();
      });

      document.getElementById('btn-collab-new').addEventListener('click', () => {
        hideCollabModal();
        HomePreload.openCollabHostNew();
      });

      document.getElementById('btn-collab-cancel').addEventListener('click', hideCollabModal);
      collabModal.addEventListener('click', (event) => {
        if (event.target === collabModal) hideCollabModal();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && collabModal.classList.contains('open')) {
          hideCollabModal();
        }
      });

      settingsButton.addEventListener('click', () => {
        HomePreload.openSettings();
      });
    </script>
  </body>
</html>
