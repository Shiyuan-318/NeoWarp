<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Unfortunately can't really enforce a CSP due to custom extensions -->
    <style>
      .splash-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "HarmonyOS Sans SC Medium", "HarmonyOS Sans SC Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: white;
      }
      .splash-screen[hidden],
      .tw-loaded .splash-screen {
        display: none;
      }
      .splash-screen[data-theme="dark"] {
        background-color: #333;
        color: white;
      }
      .splash-spinner:after {
        content: " ";
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 6px solid;
        border-color: currentColor transparent currentColor transparent;
        animation: splash-spinner 1.2s linear infinite;
      }
      @keyframes splash-spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
      <link rel="manifest" href="../manifest.webmanifest">
    <link rel="preload" href="index.js" as="script" fetchpriority="high">
    <style>
      .splash-reset {
        color: inherit;
        background: none;
        padding: 0;
        margin: 0;
        border: none;
        font-family: inherit;
        font-size: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .splash-reset[hidden] { display: none; }
    </style>
    <script src="../assets/vendor/mqtt.min.js"></script>
    <script src="../assets/nw-core.js"></script>
    <script src="../assets/shims/editor.js"></script>
  </head>
  <body>
    <div class="splash-screen" id="splash-waiting-for-js" hidden>
      <div class="splash-spinner"></div>
      <button class="splash-reset" id="splash-reset" type="button" hidden>加载有问题？点此清除缓存并重试</button>
    </div>

    <script>
      (function() {
        var theme = '';
        var accent = '#ff4c4c';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.accent === 'purple') {
              accent = '#855cd6';
            } else if (parsed.accent === 'blue') {
              accent = '#4c97ff';
            }
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.getElementById('splash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        if (theme !== 'dark') {
          splash.style.backgroundColor = accent;
        }
        splash.hidden = false;
      })();
    </script>

    <div id="app"></div>

    
    
      <script>
      function webpackScriptError (event) {
        alert('Error loading webpack script: ' + event.target.src);
      }
    </script>
    <script src="index.js" onerror="webpackScriptError(event)"></script>
    <script>
      // 启动超过 8 秒仍未就绪（未加上 .tw-loaded）时，显示「清除缓存」入口
      (function () {
        var resetButton = document.getElementById('splash-reset');
        if (!resetButton) return;
        resetButton.addEventListener('click', function () {
          if (window.NeoWarpPWA) window.NeoWarpPWA.reset();
        });
        setTimeout(function () {
          var app = document.getElementById('app');
          var ready = document.body.classList.contains('tw-loaded') || (app && app.children.length > 0);
          if (!ready) {
            resetButton.hidden = false;
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
