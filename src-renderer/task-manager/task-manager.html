<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务管理器</title>
<style>
:root {
  --bg: #000000;
  --bg-card: #1c1c1e;
  --bg-card-hover: rgba(255,255,255,0.06);
  --bg-header: rgba(28,28,30,0.72);
  --bg-inset: rgba(255,255,255,0.05);
  --text: #f5f5f7;
  --text-dim: #98989d;
  --accent: #0a84ff;
  --accent2: #bf5af2;
  --cpu-color: #0a84ff;
  --ram-color: #bf5af2;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --separator: rgba(255,255,255,0.06);
  --grid-line: rgba(255,255,255,0.06);
  --grid-text: rgba(255,255,255,0.35);
  --sprite-icon-bg: rgba(10,132,255,0.10);
  --shadow-card: 0 0.5px 0 rgba(255,255,255,0.06) inset, 0 2px 10px rgba(0,0,0,0.35);
  --radius: 14px;
  --radius-sm: 8px;
}
:root.light {
  --bg: #f5f5f7;
  --bg-card: #ffffff;
  --bg-card-hover: rgba(0,0,0,0.035);
  --bg-header: rgba(255,255,255,0.72);
  --bg-inset: rgba(0,0,0,0.04);
  --text: #1d1d1f;
  --text-dim: #86868b;
  --accent: #007aff;
  --accent2: #af52de;
  --cpu-color: #007aff;
  --ram-color: #af52de;
  --border: rgba(0,0,0,0.05);
  --border-strong: rgba(0,0,0,0.10);
  --separator: rgba(0,0,0,0.06);
  --grid-line: rgba(0,0,0,0.05);
  --grid-text: rgba(0,0,0,0.35);
  --sprite-icon-bg: rgba(0,122,255,0.08);
  --shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
.header {
  display: flex;
  align-items: center;
  padding: 13px 18px;
  background: var(--bg-header);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
  flex-shrink: 0;
}
.header h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header h1 svg { width: 17px; height: 17px; opacity: 0.85; }
.live {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  letter-spacing: 0.3px;
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cpu-color);
  animation: pulse 2s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px 14px 16px;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* 实时指标卡片 */
.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}
.stat-card {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px 14px;
  box-shadow: var(--shadow-card);
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.stat-card:hover {
  transform: translateY(-1px);
  border-color: var(--border-strong);
}
.stat-card .label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 7px;
  letter-spacing: 0.1px;
}
.stat-card .label .dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}
.stat-card .value {
  display: flex;
  align-items: baseline;
  gap: 3px;
  margin: 3px 0 10px;
  line-height: 1.1;
}
.stat-card .value .num {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.8px;
  font-variant-numeric: tabular-nums;
}
.stat-card .value .unit {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.2px;
}
.stat-card .sub {
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  margin-bottom: 10px;
}
.stat-track {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-inset);
  overflow: hidden;
}
.stat-bar {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: inherit;
  transition: width 0.45s ease;
}
.cpu-dot { background: var(--cpu-color); box-shadow: 0 0 8px rgba(10,132,255,0.55); }
.ram-dot { background: var(--ram-color); box-shadow: 0 0 8px rgba(191,90,242,0.55); }
:root.light .cpu-dot { box-shadow: 0 0 8px rgba(0,122,255,0.4); }
:root.light .ram-dot { box-shadow: 0 0 8px rgba(175,82,222,0.4); }
.cpu-value { color: var(--cpu-color); }
.ram-value { color: var(--ram-color); }
.stat-bar.cpu { background: var(--cpu-color); }
.stat-bar.ram { background: var(--ram-color); }

/* 图表区域 */
.chart-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-card);
}
.chart-section .chart-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.1px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chart-legend {
  display: flex;
  gap: 14px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
}
.chart-legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.chart-legend .leg-line {
  width: 12px;
  height: 3px;
  border-radius: 2px;
  display: inline-block;
}
#chart-canvas {
  width: 100%;
  height: 148px;
  display: block;
  border-radius: var(--radius-sm);
}

/* 角色列表 */
.sprite-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.sprite-header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: var(--bg-inset);
  border-bottom: 0.5px solid var(--separator);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.3px;
  font-variant-numeric: tabular-nums;
}
.sprite-header .col {
  cursor: pointer;
  transition: color 0.15s;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 0;
}
.sprite-header .col:hover { color: var(--text); }
.sprite-header .col.active { color: var(--accent); }
.sort-arrow {
  display: inline-flex;
  opacity: 0;
  transition: opacity 0.15s, transform 0.15s;
}
.sprite-header .col.active .sort-arrow { opacity: 1; }
.sort-arrow svg { display: block; width: 9px; height: 6px; }
.sprite-header .col.desc .sort-arrow { transform: rotate(180deg); }

.col-name { flex: 1; min-width: 0; margin-left: 36px; }
.col-threads { width: 44px; justify-content: flex-end; }
.col-cpu { width: 96px; justify-content: flex-end; }
.col-mem { width: 78px; justify-content: flex-end; }
.col-blocks { width: 50px; justify-content: flex-end; }
.col-costumes { width: 50px; justify-content: flex-end; }

.sprite-list {
  max-height: 280px;
  overflow-y: auto;
}
.sprite-list::-webkit-scrollbar { width: 4px; }
.sprite-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sprite-item {
  display: flex;
  align-items: center;
  padding: 9px 16px;
  border-bottom: 0.5px solid var(--separator);
  transition: background 0.12s;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.sprite-item:last-child { border-bottom: none; }
.sprite-item:hover { background: var(--bg-card-hover); }
.sprite-item.is-stage .sprite-name { font-weight: 450; }

.sprite-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  margin-right: 10px;
  background: var(--sprite-icon-bg);
  color: var(--cpu-color);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sprite-icon svg { width: 14px; height: 14px; display: block; }
.sprite-item.is-stage .sprite-icon {
  color: var(--text-dim);
  background: var(--bg-inset);
}
.sprite-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
  letter-spacing: -0.1px;
}
.sprite-threads { width: 44px; text-align: right; color: var(--text-dim); }
.sprite-cpu { width: 96px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; font-weight: 500; }
.sprite-mem { width: 78px; text-align: right; color: var(--text-dim); }
.sprite-blocks { width: 50px; text-align: right; color: var(--text-dim); }
.sprite-costumes { width: 50px; text-align: right; color: var(--text-dim); }

.cpu-bar {
  display: inline-block;
  width: 32px;
  height: 4px;
  background: var(--bg-inset);
  border-radius: 2px;
  vertical-align: middle;
  overflow: hidden;
  flex-shrink: 0;
}
.cpu-bar-fill {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: var(--cpu-color);
  transition: width 0.35s ease;
}
.num-col { color: var(--text); }

.empty-state {
  padding: 40px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: 0.1px;
}
.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--bg-inset);
  border-top-color: var(--cpu-color);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <rect x="1" y="1" width="5" height="5" rx="1.2"/>
      <rect x="10" y="1" width="5" height="5" rx="1.2"/>
      <rect x="1" y="10" width="5" height="5" rx="1.2"/>
      <rect x="10" y="10" width="5" height="5" rx="1.2"/>
    </svg>
    任务管理器
  </h1>
  <div class="live"><span class="live-dot"></span>实时</div>
</div>

<div class="content">
  <!-- 实时指标 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="label"><span class="dot cpu-dot"></span>CPU</div>
      <div class="value cpu-value"><span class="num" id="cpu-value">0</span><span class="unit">%</span></div>
      <div class="sub" id="cpu-sub">0 核心 / 0 线程</div>
      <div class="stat-track"><span class="stat-bar cpu" id="cpu-bar"></span></div>
    </div>
    <div class="stat-card">
      <div class="label"><span class="dot ram-dot"></span>RAM</div>
      <div class="value ram-value"><span class="num" id="ram-value">0</span><span class="unit" id="ram-unit">MB</span></div>
      <div class="sub" id="ram-sub">共 0 MB</div>
      <div class="stat-track"><span class="stat-bar ram" id="ram-bar"></span></div>
    </div>
  </div>

  <!-- 折线图 -->
  <div class="chart-section">
    <div class="chart-title">
      资源使用趋势
      <div class="chart-legend">
        <span><span class="leg-line" style="background:var(--cpu-color)"></span>CPU</span>
        <span><span class="leg-line" style="background:var(--ram-color)"></span>RAM</span>
      </div>
    </div>
    <canvas id="chart-canvas"></canvas>
  </div>

  <!-- 角色列表 -->
  <div class="sprite-section">
    <div class="sprite-header">
      <div class="col col-name active" data-sort="name">名称
        <span class="sort-arrow"><svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l4-4 4 4"/></svg></span>
      </div>
      <div class="col col-threads" data-sort="threads">线程
        <span class="sort-arrow"><svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l4-4 4 4"/></svg></span>
      </div>
      <div class="col col-cpu" data-sort="cpu">CPU
        <span class="sort-arrow"><svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l4-4 4 4"/></svg></span>
      </div>
      <div class="col col-mem" data-sort="mem">内存
        <span class="sort-arrow"><svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l4-4 4 4"/></svg></span>
      </div>
      <div class="col col-blocks" data-sort="blocks">积木
        <span class="sort-arrow"><svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l4-4 4 4"/></svg></span>
      </div>
      <div class="col col-costumes" data-sort="costumes">造型
        <span class="sort-arrow"><svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l4-4 4 4"/></svg></span>
      </div>
    </div>
    <div class="sprite-list" id="sprite-list">
      <div class="empty-state"><span class="spinner"></span><span>加载中</span></div>
    </div>
  </div>
</div>

<script>
(function() {
  // 数据存储
  var MAX_HISTORY = 60;
  var cpuHistory = [];
  var ramHistory = [];
  var currentSort = 'name';
  var sortAsc = true;
  var spriteData = [];
  var spriteDataReady = false;
  var cpuCores = 0;
  var isDark = true;

  // 图标（内联 SVG，替代 emoji）
  var iconSprite = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="4.8" r="2.7"/><path d="M2.6 14.2c.6-3 2.8-4.7 5.4-4.7s4.8 1.7 5.4 4.7"/></svg>';
  var iconStage = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="2.6" width="12.8" height="8.6" rx="1.8"/><path d="M5.4 13.4h5.2"/></svg>';

  // DOM 元素
  var cpuValueEl = document.getElementById('cpu-value');
  var cpuSubEl = document.getElementById('cpu-sub');
  var cpuBarEl = document.getElementById('cpu-bar');
  var ramValueEl = document.getElementById('ram-value');
  var ramUnitEl = document.getElementById('ram-unit');
  var ramSubEl = document.getElementById('ram-sub');
  var ramBarEl = document.getElementById('ram-bar');
  var ramCardEl = ramBarEl.closest('.stat-card');
  var spriteListEl = document.getElementById('sprite-list');
  var canvas = document.getElementById('chart-canvas');
  var ctx = canvas.getContext('2d');

  // 主题
  function applyTheme(theme) {
    isDark = theme !== 'light';
    if (isDark) {
      document.documentElement.classList.remove('light');
    } else {
      document.documentElement.classList.add('light');
    }
    drawChart();
  }

  // 初始化主题
  if (window.TaskManagerPreload) {
    window.TaskManagerPreload.getTheme().then(applyTheme);
    window.TaskManagerPreload.onThemeChanged(function(data) {
      applyTheme(data.theme || 'dark');
    });
  }

  // 排序
  var sortCols = document.querySelectorAll('.sprite-header .col');
  sortCols.forEach(function(col) {
    col.addEventListener('click', function() {
      var sort = col.dataset.sort;
      if (currentSort === sort) {
        sortAsc = !sortAsc;
      } else {
        currentSort = sort;
        sortAsc = sort === 'name';
      }
      sortCols.forEach(function(c) { c.classList.remove('active'); });
      col.classList.add('active');
      col.classList.toggle('desc', !sortAsc);
      renderSpriteList();
    });
  });

  // 内存格式化：GB 保留一位小数更精确
  function fmtMem(mb) {
    if (mb >= 1024) {
      return { num: (mb / 1024).toFixed(1), unit: 'GB' };
    }
    return { num: String(mb), unit: 'MB' };
  }

  // 空状态
  var lastEmptyKey = null;
  function showEmpty(msg, loading) {
    var key = msg + (loading ? ' (loading)' : '');
    if (key === lastEmptyKey) return;
    lastEmptyKey = key;
    spriteListEl.innerHTML = '<div class="empty-state">' +
      (loading ? '<span class="spinner"></span>' : '') +
      '<span>' + msg + '</span></div>';
  }

  // 图表绘制
  function drawChart() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    var w = rect.width;
    var h = rect.height;
    var padTop = 10;
    var padBottom = 22;
    var padLeft = 38;
    var padRight = 10;
    var chartW = w - padLeft - padRight;
    var chartH = h - padTop - padBottom;

    ctx.clearRect(0, 0, w, h);

    var gridColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
    var textColor = isDark ? 'rgba(255,255,255,0.38)' : 'rgba(0,0,0,0.4)';
    var baselineColor = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';

    // 虚线网格
    ctx.lineWidth = 1;
    for (var i = 0; i < 4; i++) {
      var y = padTop + (chartH / 4) * i;
      ctx.beginPath();
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = gridColor;
      ctx.moveTo(padLeft, y);
      ctx.lineTo(w - padRight, y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // 底部基准线
    ctx.beginPath();
    ctx.strokeStyle = baselineColor;
    ctx.moveTo(padLeft, padTop + chartH);
    ctx.lineTo(w - padRight, padTop + chartH);
    ctx.stroke();

    // Y 轴标签
    ctx.fillStyle = textColor;
    ctx.font = '10px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var i = 0; i <= 4; i++) {
      var y = padTop + (chartH / 4) * i;
      var val = 100 - i * 25;
      ctx.fillText(val + '%', padLeft - 7, y);
    }

    var step = chartW / (MAX_HISTORY - 1);
    var baselineY = padTop + chartH;

    // 平滑曲线路径
    function pathThrough(pts) {
      if (pts.length < 2) return false;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      if (pts.length === 2) {
        ctx.lineTo(pts[1].x, pts[1].y);
        return true;
      }
      for (var i = 1; i < pts.length - 1; i++) {
        var xc = (pts[i].x + pts[i + 1].x) / 2;
        var yc = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
      }
      ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
      return true;
    }

    // 绘制线条
    function drawLine(data, color, fillColor) {
      if (data.length < 2) return;
      var pts = data.map(function(d, i) {
        var v = Math.min(d.v, 100);
        return {
          x: padLeft + (MAX_HISTORY - data.length + i) * step,
          y: baselineY - (v / 100) * chartH
        };
      });

      // 填充区域
      ctx.save();
      pathThrough(pts);
      ctx.lineTo(pts[pts.length - 1].x, baselineY);
      ctx.lineTo(pts[0].x, baselineY);
      ctx.closePath();
      var grad = ctx.createLinearGradient(0, padTop, 0, baselineY);
      grad.addColorStop(0, fillColor);
      grad.addColorStop(1, isDark ? 'rgba(0,0,0,0)' : 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      // 线条
      pathThrough(pts);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();

      // 终点光晕
      var last = pts[pts.length - 1];
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.arc(last.x, last.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(last.x, last.y, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = isDark ? '#1c1c1e' : '#ffffff';
      ctx.fill();
    }

    // RAM 百分比
    var ramPercents = ramHistory.map(function(r) { return { v: r.percent, t: r.t }; });
    var cpuColor = isDark ? '#0a84ff' : '#007aff';
    var ramColor = isDark ? '#bf5af2' : '#af52de';
    var cpuFill = isDark ? 'rgba(10,132,255,0.20)' : 'rgba(0,122,255,0.12)';
    var ramFill = isDark ? 'rgba(191,90,242,0.14)' : 'rgba(175,82,222,0.10)';
    drawLine(cpuHistory, cpuColor, cpuFill);
    drawLine(ramPercents, ramColor, ramFill);

    // X 轴时间标签 - 基于数据点的实际时间戳
    if (cpuHistory.length > 0) {
      ctx.fillStyle = textColor;
      ctx.font = '10px -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      var now = Date.now();
      var positions = [0, cpuHistory.length >= 10 ? 0.5 : null, 1];
      for (var i = 0; i < positions.length; i++) {
        if (positions[i] === null) continue;
        var pos = positions[i];
        var dataIdx = Math.min(Math.round(pos * (cpuHistory.length - 1)), cpuHistory.length - 1);
        var x = padLeft + pos * chartW;
        var secAgo = Math.round((now - cpuHistory[dataIdx].t) / 1000);
        ctx.fillText(secAgo <= 0 ? '现在' : '-' + secAgo + 's', x, baselineY + 6);
      }
    }
  }

  // 渲染角色列表
  function renderSpriteList() {
    lastEmptyKey = null;
    var sorted = spriteData.slice().sort(function(a, b) {
      var va, vb;
      switch (currentSort) {
        case 'name': va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
        case 'threads': va = a.threads; vb = b.threads; break;
        case 'cpu': va = a.cpuPercent; vb = b.cpuPercent; break;
        case 'mem': va = a.memEstimateKB; vb = b.memEstimateKB; break;
        case 'blocks': va = a.blockCount; vb = b.blockCount; break;
        case 'costumes': va = a.costumeCount; vb = b.costumeCount; break;
        default: va = 0; vb = 0;
      }
      if (typeof va === 'string') {
        return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      }
      return sortAsc ? va - vb : vb - va;
    });

    if (sorted.length === 0) {
      showEmpty('暂无角色数据', false);
      return;
    }

    var colorHigh = isDark ? '#ff453a' : '#ff3b30';
    var colorMid = isDark ? '#ff9f0a' : '#ff9500';
    spriteListEl.innerHTML = sorted.map(function(s) {
      var cpuPercent = Math.min(s.cpuPercent, 100);
      var cpuColor = cpuPercent > 50 ? colorHigh : cpuPercent > 20 ? colorMid : 'var(--cpu-color)';
      var memStr = s.memEstimateKB >= 1024
        ? (s.memEstimateKB / 1024).toFixed(1) + ' MB'
        : s.memEstimateKB + ' KB';
      return '<div class="sprite-item' + (s.isStage ? ' is-stage' : '') + '">' +
        '<div class="sprite-icon">' + (s.isStage ? iconStage : iconSprite) + '</div>' +
        '<div class="sprite-name" title="' + escapeHtml(s.name) + '">' + escapeHtml(s.name) + '</div>' +
        '<div class="sprite-threads">' + s.threads + '</div>' +
        '<div class="sprite-cpu">' +
          '<span class="cpu-bar"><span class="cpu-bar-fill" style="width:' + cpuPercent + '%;background:' + cpuColor + '"></span></span>' +
          '<span>' + cpuPercent.toFixed(1) + '%</span>' +
        '</div>' +
        '<div class="sprite-mem">' + memStr + '</div>' +
        '<div class="sprite-blocks">' + s.blockCount + '</div>' +
        '<div class="sprite-costumes">' + s.costumeCount + '</div>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 数据更新
  var lastTotalThreads = 0;
  function updateData() {
    if (!window.TaskManagerPreload) return;

    window.TaskManagerPreload.getSystemStats().then(function(stats) {
      cpuValueEl.textContent = stats.cpuPercent;
      cpuBarEl.style.width = stats.cpuPercent + '%';
      cpuSubEl.textContent = (cpuCores || '?') + ' 核心 / ' + lastTotalThreads + ' 线程';

      var used = fmtMem(stats.ramUsedMB);
      var total = fmtMem(stats.ramTotalMB);
      ramValueEl.textContent = used.num;
      ramUnitEl.textContent = used.unit;
      ramSubEl.textContent = '共 ' + total.num + ' ' + total.unit;
      ramCardEl.title = stats.ramUsedMB + ' MB / ' + stats.ramTotalMB + ' MB';

      var now = Date.now();
      cpuHistory.push({ v: stats.cpuPercent, t: now });
      if (cpuHistory.length > MAX_HISTORY) cpuHistory.shift();

      var ramPercent = stats.ramTotalMB > 0 ? Math.min((stats.ramUsedMB / stats.ramTotalMB * 100), 100) : 0;
      ramBarEl.style.width = ramPercent.toFixed(1) + '%';
      ramHistory.push({ percent: ramPercent, usedMB: stats.ramUsedMB, totalMB: stats.ramTotalMB, t: now });
      if (ramHistory.length > MAX_HISTORY) ramHistory.shift();

      drawChart();
    }).catch(function(e) {
      console.error('获取系统统计失败:', e);
    });

    window.TaskManagerPreload.getSpriteStats().then(function(spriteStats) {
      if (spriteStats) {
        lastTotalThreads = spriteStats.totalThreads || 0;
        cpuSubEl.textContent = (cpuCores || '?') + ' 核心 / ' + lastTotalThreads + ' 线程';
      }
      if (spriteStats && spriteStats.sprites && spriteStats.sprites.length > 0) {
        spriteData = spriteStats.sprites;
        spriteDataReady = true;
        renderSpriteList();
      } else if (!spriteDataReady) {
        // 首次加载
        if (!spriteData.length) showEmpty('获取角色数据中', true);
      }
      // 如果之前有数据但现在获取失败，保留上次的数据
    }).catch(function(e) {
      console.error('获取角色统计失败:', e);
    });
  }

  // 获取 CPU 核心数
  try {
    cpuCores = navigator.hardwareConcurrency || 0;
  } catch (e) {}

  // 启动
  updateData();
  setInterval(updateData, 1500);

  // 窗口大小变化时重绘图表
  window.addEventListener('resize', drawChart);
})();
</script>
</body>
</html>
