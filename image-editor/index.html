<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>图片编辑器</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: #f5f5f7;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        display: flex;
        flex-direction: column;
      }

      :root {
        /* 黑白中性配色：深色主题近黑，强调色为白 */
        --accent: #f2f2f2;
        --accent-contrast: #0a0a0a;
        --accent-soft: rgba(255, 255, 255, 0.1);
        --bg: #0a0a0a;
        --panel: #121212;
        --panel-2: #1b1b1b;
        --panel-3: #242424;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text: #f2f2f2;
        --text-dim: rgba(242, 242, 242, 0.45);
        --shadow-pop: 0 12px 40px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      html[data-theme="light"] {
        --accent: #111111;
        --accent-contrast: #ffffff;
        --accent-soft: rgba(0, 0, 0, 0.07);
        --bg: #f2f2f2;
        --panel: #ffffff;
        --panel-2: #f4f4f4;
        --panel-3: #eaeaea;
        --border: rgba(0, 0, 0, 0.1);
        --border-strong: rgba(0, 0, 0, 0.2);
        --text: #111111;
        --text-dim: rgba(0, 0, 0, 0.55);
        --shadow-pop: 0 12px 36px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      button {
        appearance: none;
        border: none;
        outline: none;
        font-family: inherit;
        color: inherit;
        background: transparent;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      svg { display: block; }

      /* ===== 顶栏 ===== */
      .topbar {
        flex-shrink: 0;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .app-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: 6px;
      }
      .app-name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }
      .divider-v {
        width: 1px;
        height: 22px;
        background: var(--border-strong);
        flex-shrink: 0;
        margin: 0 4px;
      }
      .tb-group {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .tb-btn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        transition: background 0.14s ease, color 0.14s ease, transform 0.1s ease;
      }
      .tb-btn:hover:not(:disabled) {
        background: var(--panel-2);
        color: var(--text);
      }
      .tb-btn:active:not(:disabled) { transform: scale(0.93); }
      .tb-btn svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .zoom-pill {
        display: flex;
        align-items: center;
        background: var(--panel-2);
        border-radius: 8px;
        padding: 2px;
      }
      .zoom-pill .tb-btn { width: 30px; height: 30px; }
      .zoom-value {
        min-width: 48px;
        text-align: center;
        font-size: 12px;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }
      .spacer { flex: 1; }
      .btn-primary {
        padding: 8px 18px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.4px;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: filter 0.14s ease, transform 0.1s ease;
      }
      .btn-primary:hover:not(:disabled) { filter: brightness(1.12); }
      .btn-primary:active:not(:disabled) { transform: scale(0.97); }
      .btn-primary svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn-ghost {
        padding: 7px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 12.5px;
        transition: background 0.14s ease, border-color 0.14s ease;
      }
      .btn-ghost:hover:not(:disabled) { border-color: var(--border-strong); }

      /* ===== 主体 ===== */
      .main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      /* 左侧工具栏 */
      .toolbar {
        flex-shrink: 0;
        width: 56px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 0;
      }
      .tool-btn {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        transition: background 0.14s ease, color 0.14s ease, transform 0.1s ease;
      }
      .tool-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tool-btn:hover {
        background: var(--panel-2);
        color: var(--text);
      }
      .tool-btn:active { transform: scale(0.93); }
      .tool-btn.active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .tool-btn.active::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .tool-sep {
        width: 26px;
        height: 1px;
        background: var(--border);
        margin: 5px 0;
        flex-shrink: 0;
      }

      /* 形状弹层 */
      .shape-flyout {
        position: fixed;
        z-index: 30;
        left: 62px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-pop);
        padding: 10px;
        display: none;
        grid-template-columns: repeat(4, 44px);
        gap: 6px;
      }
      .shape-flyout.visible { display: grid; }
      .flyout-item {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        background: var(--panel-2);
        border: 1.5px solid transparent;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.13s ease, color 0.13s ease, transform 0.1s ease;
      }
      .flyout-item:hover { color: var(--text); border-color: var(--border-strong); transform: translateY(-1px); }
      .flyout-item.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
      .flyout-item svg { width: 22px; height: 22px; }

      /* 画布区域 */
      .canvas-wrap {
        flex: 1;
        min-width: 0;
        position: relative;
        display: flex;
      }
      .canvas-area {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(45deg, rgba(128, 128, 128, 0.05) 25%, transparent 25%, transparent 75%, rgba(128, 128, 128, 0.05) 75%),
          linear-gradient(45deg, rgba(128, 128, 128, 0.05) 25%, transparent 25%, transparent 75%, rgba(128, 128, 128, 0.05) 75%),
          var(--bg);
        background-size: 22px 22px;
        background-position: 0 0, 11px 11px;
      }
      .canvas-area[data-mode="draw"] { cursor: crosshair; }
      .canvas-area[data-mode="draw"] #canvas { cursor: crosshair; }
      .canvas-area[data-mode="select"] #canvas { cursor: default; }
      .canvas-area[data-mode="select"].hover-shape #canvas { cursor: move; }
      .canvas-area.space-pan, .canvas-area.space-pan #canvas { cursor: grab !important; }
      .canvas-area.panning, .canvas-area.panning #canvas { cursor: grabbing !important; }
      .canvas-stack {
        position: relative;
        flex-shrink: 0;
      }
      #canvas {
        display: block;
        border-radius: 8px;
        box-shadow: 0 14px 48px rgba(0, 0, 0, 0.42);
      }
      html[data-theme="light"] #canvas {
        box-shadow: 0 14px 44px rgba(30, 40, 80, 0.18);
      }
      #preview-canvas {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        display: none;
      }
      #preview-canvas.active { display: block; }

      /* 选择框 */
      .shape-selection {
        position: absolute;
        border: 1.5px solid var(--accent);
        border-radius: 3px;
        pointer-events: none;
        display: none;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      }
      .shape-selection.active { display: block; }
      .shape-selection .corner {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: #fff;
        border: 1.5px solid var(--accent);
        pointer-events: auto;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }
      .shape-selection .corner.tl { left: -6px; top: -6px; cursor: nwse-resize; }
      .shape-selection .corner.tr { right: -6px; top: -6px; cursor: nesw-resize; }
      .shape-selection .corner.bl { left: -6px; bottom: -6px; cursor: nesw-resize; }
      .shape-selection .corner.br { right: -6px; bottom: -6px; cursor: nwse-resize; }

      /* 裁剪遮罩：默认整体隐藏（旧版 crop-box 常驻 + 9999px 阴影会在
         打开图片后留一个"幽灵选择框"盖住整张图），只在裁剪模式显示 */
      .crop-overlay {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 8px;
        pointer-events: none;
        display: none;
      }
      .crop-overlay.active { pointer-events: auto; display: block; }
      .crop-box {
        position: absolute;
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        border-radius: 4px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
        cursor: move;
        touch-action: none;
      }
      .crop-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .crop-grid::before,
      .crop-grid::after {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0; right: 0;
      }
      .crop-grid::before {
        background:
          linear-gradient(rgba(255,255,255,0.32), rgba(255,255,255,0.32)) 33.33% 0 / 1px 100% no-repeat,
          linear-gradient(rgba(255,255,255,0.32), rgba(255,255,255,0.32)) 66.66% 0 / 1px 100% no-repeat;
      }
      .crop-grid::after {
        background:
          linear-gradient(rgba(255,255,255,0.32), rgba(255,255,255,0.32)) 0 33.33% / 100% 1px no-repeat,
          linear-gradient(rgba(255,255,255,0.32), rgba(255,255,255,0.32)) 0 66.66% / 100% 1px no-repeat;
      }
      .crop-handle {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .crop-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
      .crop-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
      .crop-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
      .crop-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }

      /* 画布底部提示（悬浮在画布区之上，不随滚动移动） */
      .mode-hint {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: fit-content;
        max-width: 82%;
        z-index: 5;
        background: rgba(20, 20, 20, 0.55);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: rgba(245, 245, 247, 0.92);
        border-radius: 8px;
        padding: 8px 18px;
        font-size: 12.5px;
        letter-spacing: 0.3px;
        pointer-events: none;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      html[data-theme="light"] .mode-hint {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border: 1px solid rgba(0, 0, 0, 0.16);
        color: rgba(0, 0, 0, 0.8);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
      }
      .mode-hint .hint-key {
        display: inline-block;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 5px;
        padding: 0 6px;
        font-size: 11px;
        font-family: Consolas, monospace;
      }
      html[data-theme="light"] .mode-hint .hint-key {
        background: rgba(0, 0, 0, 0.08);
      }

      /* 上下文工具条（选中形状时，悬浮于画布底部中央） */
      .context-bar {
        position: absolute;
        bottom: 54px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        z-index: 6;
        display: none;
        align-items: center;
        gap: 8px;
        background: rgba(22, 22, 22, 0.55);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        padding: 8px 12px;
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.5);
      }
      .context-bar.visible { display: flex; }
      html[data-theme="light"] .context-bar {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(0, 0, 0, 0.16);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.16);
      }
      .context-bar input[type="color"] {
        appearance: none;
        -webkit-appearance: none;
        width: 30px;
        height: 26px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--panel-2);
        padding: 2px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .context-bar input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      .context-bar input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 6px;
      }
      .ctx-seg {
        display: flex;
        gap: 2px;
        background: var(--panel-2);
        border-radius: 9px;
        padding: 2px;
      }
      .ctx-seg button {
        padding: 5px 11px;
        border-radius: 7px;
        font-size: 12px;
        color: var(--text-dim);
        white-space: nowrap;
        transition: background 0.13s ease, color 0.13s ease;
      }
      .ctx-seg button:hover { color: var(--text); }
      .ctx-seg button.active {
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 600;
      }
      .ctx-slider {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ctx-slider label {
        font-size: 11.5px;
        color: var(--text-dim);
        white-space: nowrap;
      }
      .ctx-slider input[type="range"] {
        width: 80px;
        flex: none;
      }
      .ctx-btn {
        width: 29px;
        height: 29px;
        border-radius: 8px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.13s ease, color 0.13s ease;
      }
      .ctx-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
      .ctx-btn svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ctx-divider {
        width: 1px;
        height: 20px;
        background: var(--border-strong);
        flex-shrink: 0;
      }

      /* 右键上下文菜单 */
      .ctx-menu {
        position: fixed;
        z-index: 60;
        min-width: 158px;
        background: var(--panel);
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        box-shadow: var(--shadow-pop);
        padding: 4px;
        display: none;
      }
      .ctx-menu.visible { display: block; }
      .ctx-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 7px 12px;
        border-radius: 6px;
        font-size: 12.5px;
        color: var(--text);
        white-space: nowrap;
      }
      .ctx-menu button:hover:not(:disabled) { background: var(--panel-2); }
      .ctx-menu button:disabled { opacity: 0.35; cursor: default; }
      .ctx-menu-sep {
        height: 1px;
        background: var(--border);
        margin: 4px 6px;
      }

      /* 右侧面板折叠：按钮贴在画布区右缘的接缝上 */
      .panel-toggle {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 52px;
        z-index: 12;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-right: none;
        border-radius: 8px 0 0 8px;
        color: var(--text-dim);
      }
      .panel-toggle:hover { color: var(--text); }
      .panel-toggle svg {
        width: 11px;
        height: 11px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.15s ease;
      }
      .main.panel-hidden .panel-toggle svg { transform: rotate(180deg); }
      .side-panel.collapsed { display: none; }

      /* 空状态 */
      .empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
      }
      .empty-state[hidden] { display: none; }
      .drop-zone {
        width: 440px;
        max-width: 100%;
        padding: 52px 40px;
        border: 2px dashed var(--border-strong);
        border-radius: 24px;
        background: var(--panel);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      }
      .drop-zone.dragover {
        border-color: var(--accent);
        background: var(--accent-soft);
        transform: scale(1.02);
      }
      .drop-icon {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .drop-icon svg {
        width: 32px;
        height: 32px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .drop-title {
        font-size: 17px;
        font-weight: 600;
      }
      .drop-desc {
        font-size: 12.5px;
        color: var(--text-dim);
        line-height: 1.6;
        white-space: pre-line;
      }

      /* 右侧面板 */
      .side-panel {
        flex-shrink: 0;
        width: 264px;
        background: var(--panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel-tabs {
        flex-shrink: 0;
        display: flex;
        gap: 2px;
        padding: 10px 8px 0;
      }
      .panel-tab {
        flex: 1;
        padding: 8px 0;
        border-radius: 10px;
        font-size: 12.5px;
        color: var(--text-dim);
        transition: background 0.14s ease, color 0.14s ease;
        white-space: nowrap;
      }
      .panel-tab:hover { color: var(--text); }
      .panel-tab.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }
      .panel-body::-webkit-scrollbar { width: 6px; }
      .panel-body::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 3px;
      }
      .panel-page[hidden] { display: none; }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 2px 0 10px;
      }

      /* 调整滑块 */
      .slider-group { margin-bottom: 15px; }
      .slider-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .slider-label {
        font-size: 12.5px;
        color: var(--text-dim);
        letter-spacing: 0.3px;
      }
      .slider-value {
        font-size: 11.5px;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        background: var(--panel-2);
        border-radius: 6px;
        padding: 2px 7px;
        min-width: 44px;
        text-align: center;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input[type="range"] {
        flex: 1;
        appearance: none;
        -webkit-appearance: none;
        height: 4px;
        border-radius: 2px;
        background: var(--border-strong);
        outline: none;
      }
      input[type="range"]:disabled { opacity: 0.4; }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
      .reset-mini {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.14s ease, color 0.14s ease;
      }
      .reset-mini:hover {
        background: var(--panel-2);
        color: var(--text);
      }
      .reset-mini svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* 滤镜预设 */
      .preset-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .preset-item {
        border: 1.5px solid transparent;
        border-radius: 12px;
        background: var(--panel-2);
        padding: 5px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        transition: border-color 0.14s ease, transform 0.12s ease;
      }
      .preset-item:hover { transform: translateY(-1px); }
      .preset-item.active { border-color: var(--accent); }
      .preset-thumb {
        height: 56px;
        border-radius: 8px;
        background-color: var(--border);
        background-size: cover;
        background-position: center;
        filter: none;
      }
      .preset-name {
        font-size: 12px;
        color: var(--text-dim);
        text-align: center;
      }
      .preset-item.active .preset-name { color: var(--accent); }

      /* 图层面板 */
      .layer-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 12px;
      }
      .layer-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 10px;
        background: var(--panel-2);
        border: 1.5px solid transparent;
        cursor: pointer;
        transition: border-color 0.14s ease;
      }
      .layer-item:hover { border-color: var(--border-strong); }
      .layer-item.selected { border-color: var(--accent); }
      .layer-item .layer-icon {
        flex-shrink: 0;
        width: 25px;
        height: 25px;
        border-radius: 7px;
        background: var(--accent-soft);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .layer-item .layer-icon svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .layer-item .layer-name {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .layer-item.hidden-layer .layer-name { opacity: 0.4; }
      .layer-mini {
        flex-shrink: 0;
        width: 23px;
        height: 23px;
        border-radius: 7px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .layer-mini:hover { color: var(--text); background: var(--border); }
      .layer-mini svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .layer-item.hidden-layer .layer-mini.eye svg { opacity: 0.35; }
      .layer-toolbar {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .layer-toolbar .btn-ghost {
        flex: 1;
        padding: 6px 0;
        font-size: 12px;
        text-align: center;
      }
      .glass-note {
        font-size: 11px;
        color: var(--text-dim);
        line-height: 1.7;
      }

      /* 裁剪比例 */
      .aspect-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .aspect-chip {
        padding: 8px 0;
        border-radius: 10px;
        background: var(--panel-2);
        font-size: 12px;
        color: var(--text-dim);
        border: 1.5px solid transparent;
        transition: border-color 0.14s ease, color 0.14s ease;
      }
      .aspect-chip:hover { color: var(--text); }
      .aspect-chip.active {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      .crop-actions { display: flex; gap: 8px; }
      .crop-actions .btn-ghost,
      .crop-actions .btn-primary {
        flex: 1;
        justify-content: center;
        display: flex;
        align-items: center;
      }
      .crop-actions .btn-primary { padding: 8px 0; font-size: 13px; }
      .crop-actions .btn-ghost { padding: 8px 0; }

      .panel-empty {
        text-align: center;
        color: var(--text-dim);
        font-size: 12.5px;
        line-height: 1.7;
        padding: 30px 10px;
      }

      /* ===== 导出弹窗 ===== */
      .modal-mask {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      .modal-mask.visible { opacity: 1; pointer-events: auto; }
      .modal {
        width: 380px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 22px;
        box-shadow: var(--shadow-pop);
        transform: translateY(14px) scale(0.97);
        transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .modal-mask.visible .modal { transform: translateY(0) scale(1); }
      .modal-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 16px;
      }
      .format-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .format-chip {
        flex: 1;
        padding: 10px 0;
        border-radius: 12px;
        background: var(--panel-2);
        border: 1.5px solid transparent;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        transition: border-color 0.14s ease, color 0.14s ease;
      }
      .format-chip.active { border-color: var(--accent); color: var(--accent); }
      .quality-group { margin-bottom: 20px; }
      .quality-group.disabled { opacity: 0.35; pointer-events: none; }
      .modal-actions { display: flex; gap: 10px; }
      .modal-actions .btn-ghost,
      .modal-actions .btn-primary { flex: 1; justify-content: center; }
      .export-size {
        font-size: 12px;
        color: var(--text-dim);
        margin: -6px 0 14px;
      }

      /* Toast */
      #toast {
        position: fixed;
        z-index: 50;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%) translateY(20px);
        background: rgba(30, 30, 30, 0.62);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        color: #f5f5f7;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 11px 24px;
        font-size: 13.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        max-width: 80%;
        text-align: center;
      }
      html[data-theme="light"] #toast {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        color: #111111;
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }
      #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
      <script src="../assets/nw-core.js"></script>

  <body>
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="app-title">

        </button>
      </div>
      <div class="divider-v"></div>
      <div class="zoom-pill">
        <button class="tb-btn" id="btn-zoom-out" title="缩小 (Ctrl+滚轮)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6"/></svg>
        </button>
        <div class="zoom-value" id="zoom-value">100%</div>

          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6M11 8v6"/></svg>
        </button>
        <button class="tb-btn" id="btn-fit" title="适应窗口">
          <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
        </button>
      </div>
      <div class="spacer"></div>
      <button class="tb-btn" id="btn-panel" title="折叠 / 展开右侧面板">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      <button class="btn-ghost" id="btn-reset" title="恢复原图" disabled>重置</button>
      <button class="btn-primary" id="btn-export" disabled>

        <span>导出</span>
      </button>
    </div>

    <div class="main">
      <!-- 左侧工具 -->
      <div class="toolbar">
        <button class="tool-btn" id="tool-open" title="打开图片 (Ctrl+O)">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
        </button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="tool-select" title="选择 / 移动 (V)">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.5L9 19 5 3z"/></svg>
        </button>
        <button class="tool-btn" id="tool-shape" title="插入形状">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4.5"/><rect x="12.5" y="12.5" width="8" height="8" rx="1.5"/><path d="M12 3.5l4 7h-8l4-7z"/></svg>
        </button>
        <button class="tool-btn" id="tool-crop" title="裁剪 (C)">
          <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        </button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="tool-rotate-left" title="向左旋转 90°">
          <svg viewBox="0 0 24 24"><path d="M3 8a9 9 0 1 1 2.6 7.4"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="tool-btn" id="tool-rotate-right" title="向右旋转 90°">
          <svg viewBox="0 0 24 24"><path d="M21 8a9 9 0 1 0-2.6 7.4"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="tool-btn" id="tool-flip-h" title="水平翻转">

        </button>
        <button class="tool-btn" id="tool-flip-v" title="垂直翻转">
          <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M7 8l5-5 5 5H7z"/><path d="M7 16l5 5 5-5H7z"/></svg>

      <!-- 形状弹层 -->

            <div class="drop-title">拖放图片到此处</div>

支持 PNG / JPG / WebP / GIF / BMP</div>
            <button class="btn-primary" id="btn-open-empty">

              <span>打开图片</span>

        <!-- 上下文工具条 + 模式提示（悬浮层，不随画布滚动） -->

          <div class="slider-row">
            <input type="range" id="quality-slider" min="10" max="100" value="92">

      // ============================================================

      // ---------- 2. DOM 引用与常量 ----------

      var DEFAULT_ADJ = {

      };

        { key: 'blur',       label: '模糊',   min: 0,   max: 20,  unit: 'px', step: 0.5 },

      var PRESETS = [
        { id: 'none',     name: '原图', adj: {} },
        { id: 'mono',     name: '黑白', adj: { grayscale: 100 } },
        { id: 'vintage',  name: '怀旧', adj: { sepia: 45, contrast: 90, brightness: 106, saturate: 85 } },
        { id: 'cool',     name: '冷调', adj: { hue: -18, saturate: 115, brightness: 102 } },
        { id: 'warm',     name: '暖调', adj: { sepia: 22, saturate: 125, brightness: 104 } },
        { id: 'cinema',   name: '电影', adj: { contrast: 122, saturate: 118, brightness: 95, hue: -8 } },

      var SHAPES = [

        { id: 'circle',       label: '圆形' },

        { id: 'trapezoid',    label: '梯形' },

      var SHAPE_ICONS = {
        'rect': '<rect x="4" y="5" width="16" height="14" rx="1"/>',
        'rounded-rect': '<rect x="4" y="5" width="16" height="14" rx="4"/>',
        'circle': '<circle cx="12" cy="12" r="8"/>',
        'triangle': '<path d="M12 4l8 15H4l8-15z"/>',
        'heart': '<path d="M12 20s-7-4.6-7-9.5C5 7.5 7 6 9 6c1.4 0 2.5.8 3 1.8C12.5 6.8 13.6 6 15 6c2 0 4 1.5 4 4.5 0 4.9-7 9.5-7 9.5z"/>',
        'trapezoid': '<path d="M8 6h8l4 12H4L8 6z"/>',
        'star': '<path d="M12 4l2.4 5 5.6.7-4.1 3.8 1.1 5.5-5-2.8-5 2.8 1.1-5.5L4 9.7 9.6 9 12 4z"/>',
        'diamond': '<path d="M12 4l7 8-7 8-7-8 7-8z"/>',
        'hexagon': '<path d="M12 4l7 4v8l-7 4-7-4V8l7-4z"/>',
        'pentagon': '<path d="M12 4l7.6 5.5-2.9 8.9H7.3L4.4 9.5 12 4z"/>',
        'arrow': '<path d="M4 10h9V5l7 7-7 7v-5H4v-4z"/>',
        'ring': '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'
      };

      var ASPECTS = [
        { label: '自由', v: 0 },
        { label: '1:1', v: 1 },
        { label: '4:3', v: 4 / 3 },
        { label: '3:4', v: 3 / 4 },
        { label: '16:9', v: 16 / 9 },
        { label: '9:16', v: 9 / 16 }
      ];

      var LAYER_TYPE_ICONS = {
        image: '<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-3.5-3.5a1.2 1.2 0 0 0-1.7 0L8 19"/>',
        shape: '<rect x="5" y="5" width="14" height="14" rx="3"/>'
      };

      var ZOOM_MIN = 0.05;
      var ZOOM_MAX = 5;

      // ---------- 3. 状态 ----------
      var layers = [];                // [0] = 背景图片，其余为形状图层
      var originalCanvas = null;
      var fileName = 'image';
      var zoom = 1;
      var mode = 'select';            // 'select' | 'draw' | 'crop'
      var drawingShape = null;
      var selectedLayerId = null;
      var shapeCounter = 0;
      var layerIdCounter = 1;
      var cropRect = null;
      var cropAspect = 0;
      var adjustments = Object.assign({}, DEFAULT_ADJ);
      var activePreset = 'none';
      var editHistory = [];
      var historyIndex = -1;
      var exportFormat = 'image/png';
      var exportQuality = 0.92;
      var session = null;             // 统一指针会话，见第 11 节
