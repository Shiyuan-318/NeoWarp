<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>项目分析</title>
    <style>
        :root {
            --bg: #fbfbfd;
            --card: #f3f4f8;
            --card-deep: #eceef4;
            --track: #e6e8ef;
            --text: #1c1c1e;
            --text-2: #71757e;
            --text-3: #9a9ea8;
            --accent: #0a84ff;
            --warn: #ff9500;
            --good: #34c759;
            --separator: rgba(60, 60, 67, 0.10);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        [data-theme="dark"] {
            --bg: #000000;
            --card: #1c1c1e;
            --card-deep: #2a2a2c;
            --track: #3a3a3c;
            --text: #f5f5f7;
            --text-2: #98989d;
            --text-3: #6b6b70;
            --accent: #0a84ff;
            --warn: #ff9500;
            --good: #34c759;
            --separator: rgba(84, 84, 88, 0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .loading-state {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-3);
            font-size: 13px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--track);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-3);
            font-size: 13px;
        }
        .error-state svg {
            width: 40px;
            height: 40px;
            opacity: 0.4;
        }

        .report {
            max-width: 1000px;
            margin: 0 auto;
            padding: 22px 22px 30px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
        }

        /* ---------- 报告头部 ---------- */
        .head-card {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .head-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 12px;
        }
        .head-main { flex: 1; min-width: 0; padding-top: 2px; }
        .head-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            word-break: break-word;
        }
        .head-meta {
            margin-top: 5px;
            font-size: 12.5px;
            color: var(--text-2);
            letter-spacing: -0.1px;
        }
        .head-right {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex-shrink: 0;
            padding-top: 2px;
        }
        .head-info {
            text-align: right;
            font-size: 11.5px;
            line-height: 1.6;
            color: var(--text-3);
            white-space: nowrap;
        }
        .export-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 9px;
            background: var(--card-deep);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .export-btn:hover { background: var(--track); }
        .export-btn:active { transform: scale(0.92); opacity: 0.7; }

        /* ---------- 统计卡片 ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .tile {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        .tile-label {
            font-size: 12px;
            color: var(--text-2);
            letter-spacing: -0.1px;
        }
        .tile-value {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--accent);
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .tile-value .den {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-3);
            letter-spacing: 0;
        }
        .tile-value .den-unit { font-size: 15px; font-weight: 600; }
        .mini-bar {
            height: 5px;
            border-radius: 3px;
            background: var(--track);
            margin: 6px 0 2px;
            overflow: hidden;
        }
        .mini-bar i {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: var(--accent);
        }
        .tile-sub {
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: -0.1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- 区块标题 ---------- */
        .sec-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }
        .sec-title::before {
            content: '';
            width: 4px;
            height: 14px;
            border-radius: 2px;
            background: var(--accent);
            align-self: center;
            flex-shrink: 0;
        }
        .sec-title b {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        .sec-title span {
            font-size: 12px;
            color: var(--text-3);
            letter-spacing: -0.1px;
        }
        .sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .sec-note {
            font-size: 11.5px;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* ---------- 图表通用 ---------- */
        .chart-svg { width: 100%; height: auto; display: block; }
        .bubble-legend {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 16px;
        }
        .bubble-legend .item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            color: var(--text-2);
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1.08fr 0.92fr;
            gap: 14px;
        }
        .grid-2 .card { min-width: 0; }

        /* ---------- 环形图 ---------- */
        .donut-wrap {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .donut-box {
            width: 196px;
            height: 196px;
            flex-shrink: 0;
        }
        .donut-legend {
            flex: 1;
            min-width: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 16px;
        }
        .donut-legend .item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            min-width: 0;
        }
        .donut-legend .name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-2);
        }
        .donut-legend .count {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text);
        }

        /* ---------- 条形排行 ---------- */
        .top10-empty,
        .ext-empty {
            color: var(--text-3);
            font-size: 13px;
            padding: 14px 0 8px;
            text-align: center;
        }

        /* ---------- 资源构成 ---------- */
        .res-stack {
            display: flex;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            background: var(--track);
            margin-bottom: 14px;
        }
        .res-stack i { display: block; height: 100%; }
        .res-row {
            display: grid;
            grid-template-columns: minmax(64px, 92px) 84px 46px 1fr;
            gap: 12px;
            align-items: center;
            padding: 5px 0;
            font-size: 12.5px;
        }
        .res-row .name { color: var(--text-2); white-space: nowrap; }
        .res-row .val,
        .res-row .pct {
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            white-space: nowrap;
        }
        .res-row .pct { color: var(--text-3); font-size: 11.5px; }
        .res-bar {
            height: 8px;
            border-radius: 4px;
            background: var(--track);
            overflow: hidden;
        }
        .res-bar i {
            display: block;
            height: 100%;
            border-radius: 4px;
        }

        /* ---------- json 构成 ---------- */
        .json-row {
            display: grid;
            grid-template-columns: minmax(190px, 230px) 1fr 108px;
            gap: 14px;
            align-items: center;
            padding: 6px 0;
        }
        .json-row .name {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.1px;
        }
        .json-row .desc {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .json-row .right {
            text-align: right;
            font-size: 11.5px;
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .json-row .right b {
            font-weight: 600;
            color: var(--text);
        }

        /* ---------- 拓展资源 ---------- */
        .ext-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px 28px;
        }
        .ext-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            min-width: 0;
        }
        .ext-item .name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-2);
        }
        .ext-item .use {
            font-variant-numeric: tabular-nums;
            color: var(--text-3);
            font-size: 12px;
            white-space: nowrap;
        }
        .ext-item .use b { color: var(--text); font-weight: 600; }

        /* ---------- 建议 ---------- */
        .advice-row {
            display: flex;
            gap: 10px;
            padding: 5px 0;
            font-size: 13px;
            line-height: 1.55;
            letter-spacing: -0.1px;
        }
        .advice-row i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }
        .advice-row.info i { background: var(--accent); }
        .advice-row.warn i { background: var(--warn); }
        .advice-row.ok i { background: var(--good); }

        @media (max-width: 900px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .grid-2 { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .report { padding: 16px 14px 24px; }
            .head-card { flex-wrap: wrap; }
            .ext-grid { grid-template-columns: 1fr; }
            .json-row { grid-template-columns: 1fr 90px; }
            .json-row .bar-col { display: none; }
            .res-row { grid-template-columns: 64px 72px 42px 1fr; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <span>正在分析项目...</span>
    </div>

    <div class="report" id="report" style="display:none;">
        <!-- 头部 -->
        <div class="card head-card" id="headCard">
            <svg class="head-icon" viewBox="0 0 48 48" aria-hidden="true">
                <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="#0A84FF"/>
                <path d="M14.5 33.5V15.5L33.5 32.5V14.5" stroke="#ffffff" stroke-width="4.4"
                    stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <div class="head-main">
                <div class="head-title" id="headTitle">-</div>
                <div class="head-meta" id="headMeta">-</div>
            </div>
            <div class="head-right">
                <div class="head-info">
                    <div id="headTime">-</div>
                    <div>Dr.Scratch 2015 AMS</div>
                </div>
                <button class="export-btn" id="exportBtn" title="导出为图片">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 概览指标 -->
        <div class="stats" id="statsGrid"></div>

        <!-- 代码分布趋势 -->
        <div class="card">
            <div class="sec-title"><b>代码分布趋势</b><span>(X: 概念理解难度 Y: 外观展示 ← 算法搭建)</span></div>
            <svg id="bubbleChart" class="chart-svg" viewBox="0 0 920 272" preserveAspectRatio="xMidYMid meet"></svg>
            <div class="bubble-legend" id="bubbleLegend"></div>
        </div>

        <div class="grid-2">
            <!-- 能力雷达图 -->
            <div class="card">
                <div class="sec-title"><b>Dr.Scratch 核心能力</b><span>0 – 3 分 / 维度</span></div>
                <svg id="radarChart" class="chart-svg" viewBox="0 0 320 302" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <!-- 代码基因组成 -->
            <div class="card">
                <div class="sec-title"><b>代码基因组成</b><span>按积木类别</span></div>
                <div class="donut-wrap">
                    <svg id="donutChart" class="donut-box" viewBox="0 0 200 200"></svg>
                    <div class="donut-legend" id="donutLegend"></div>
                </div>
            </div>
        </div>

        <!-- 积木使用频次 Top 10 -->
        <div class="card">
            <div class="sec-title"><b>积木使用频次 Top 10</b><span>使用次数最多的积木</span></div>
            <svg id="top10Chart" class="chart-svg" viewBox="0 0 920 336" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- 资源构成 -->
        <div class="card">
            <div class="sec-head">
                <div class="sec-title" style="margin:0;"><b>资源构成</b></div>
                <div class="sec-note" id="resTotal">-</div>
            </div>
            <div class="res-stack" id="resStack"></div>
            <div id="resRows"></div>
        </div>

        <!-- project.json 内部构成 -->
        <div class="card">
            <div class="sec-head">
                <div class="sec-title" style="margin:0;"><b>project.json 内部构成 (未压缩)</b></div>
                <div class="sec-note" id="jsonTotal">-</div>
            </div>
            <div id="jsonRows"></div>
        </div>

        <!-- 拓展资源 -->
        <div class="card">
            <div class="sec-head">
                <div class="sec-title" style="margin:0;"><b>拓展资源 (按使用量)</b></div>
                <div class="sec-note" id="extTotal">-</div>
            </div>
            <div id="extRows"></div>
        </div>

        <!-- 确定性建议 -->
        <div class="card">
            <div class="sec-title"><b>确定性建议</b><span>由当前数据直接推导</span></div>
            <div id="adviceRows"></div>
        </div>
    </div>

    <div class="error-state" id="errorState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="errorText">无法获取项目数据</span>
    </div>

    <script src="html2canvas.min.js"></script>
    <script>
    (function() {
        'use strict';

        var theme = 'light';
        var lastStats = null;

        function el(id) { return document.getElementById(id); }
        function hide(node) { node.style.display = 'none'; }
        function show(node) { node.style.display = ''; }

        /* ================= 基础工具 ================= */

        function hash01(str) {
            var h = 2166136261;
            for (var i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = (h * 16777619) >>> 0;
            }
            return (h % 100000) / 100000;
        }

        function utf8Size(str) {
            try { return new Blob([str]).size; } catch (e) { return str.length * 2; }
        }

        function fmtBytes(n) {
            if (!isFinite(n) || n == null) n = 0;
            if (n === 0) return '0 KB';
            if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
            if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
            return n + ' B';
        }

        function fmtPct(value, total) {
            if (!total) return '0%';
            return ((value / total) * 100).toFixed(1) + '%';
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function svgNode(tag, attrs) {
            var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
            if (attrs) {
                Object.keys(attrs).forEach(function(k) { node.setAttribute(k, attrs[k]); });
            }
            return node;
        }

        function chartColors() {
            var dark = theme === 'dark';
            return {
                grid: dark ? '#3a3a3c' : '#e4e6ee',
                tick: dark ? '#8d8d94' : '#98989d',
                axis: dark ? '#c4c7cf' : '#3f434b',
                label: dark ? '#98989d' : '#797e88',
                ring: dark ? '#333338' : '#dfe1e9',
                empty: dark ? '#2c2c2e' : '#dcdde3'
            };
        }

        /* ================= 积木分类与命名 ================= */

        var CATS = [
            { key: 'motion',    name: '运动',     color: '#4C97FF' },
            { key: 'looks',     name: '外观',     color: '#9966FF' },
            { key: 'sound',     name: '声音',     color: '#CF63CF' },
            { key: 'events',    name: '事件',     color: '#FFBF00' },
            { key: 'control',   name: '控制',     color: '#FFAB19' },
            { key: 'sensing',   name: '侦测',     color: '#5CB1D6' },
            { key: 'operators', name: '运算',     color: '#59C059' },
            { key: 'variables', name: '数据',     color: '#FF8C1A' },
            { key: 'myBlocks',  name: '自制积木', color: '#FF6680' }
        ];
        var CAT_BY_KEY = {};
        CATS.forEach(function(c) { CAT_BY_KEY[c.key] = c; });

        var EXT_META = {
            'music':        { name: '音乐',       color: '#CF63CF' },
            'pen':          { name: '画笔',       color: '#0FBD8C' },
            'videoSensing': { name: '视频侦测',   color: '#7C87CC' },
            'text2speech':  { name: '文字朗读',   color: '#5CB1D6' },
            'translate':    { name: '翻译',       color: '#575E75' },
            'makeymakey':   { name: 'Makey Makey', color: '#4C97FF' },
            'microbit':     { name: 'micro:bit',  color: '#FF6680' },
            'ev3':          { name: '乐高 EV3',   color: '#FF8C1A' },
            'wedo':         { name: 'WeDo',       color: '#FFBF00' },
            'wedo2':        { name: 'WeDo 2.0',   color: '#FFBF00' },
            'boost':        { name: 'Boost',      color: '#59C059' },
            'gdxfor':       { name: '重力感应',   color: '#5CB1D6' },
            'stretch':      { name: '角色拉伸',   color: '#4C97FF' },
            'gamepad':      { name: '手柄',       color: '#59C059' },
            'box2d':        { name: '物理引擎',   color: '#FF8C1A' },
            'face':         { name: '面部侦测',   color: '#FF6680' },
            'speech':       { name: '语音识别',   color: '#CF63CF' },
            'text':         { name: '艺术字',     color: '#9966FF' }
        };
        var EXT_PALETTE = ['#9966FF', '#CF63CF', '#4C97FF', '#0FBD8C', '#FFAB19', '#5CB1D6', '#FF6680', '#FFBF00', '#59C059', '#8E8E93'];

        var OPCODE_NAMES = {
            motion_movesteps: '移动步数', motion_turnright: '右转角度', motion_turnleft: '左转角度',
            motion_gotoxy: '移到 X/Y', motion_goto: '移到指定位置', motion_glidesecstoxy: '滑行到 X/Y',
            motion_glideto: '滑行到指定位置', motion_pointindirection: '面向角度', motion_pointtowards: '面向指定目标',
            motion_changexby: 'X 坐标增加', motion_setx: 'X 坐标设为', motion_changeyby: 'Y 坐标增加',
            motion_sety: 'Y 坐标设为', motion_ifonedgebounce: '碰到边缘反弹', motion_setrotationstyle: '旋转方式设为',

        function opcodeName(op) {
            return OPCODE_NAMES[op] || op;
        }

        function extMeta(seg) {
            var known = EXT_META[seg];
            var color = known ? known.color : EXT_PALETTE[Math.floor(hash01('ext:' + seg) * EXT_PALETTE.length)];
            var name = known ? known.name : seg;
            return { name: name, color: color };
        }

        // 分类积木：核心类别直接映射，其余按拓展命名空间归组
        function classify(op) {
            var seg = op.split('_')[0];
            var key = {
                motion: 'motion', looks: 'looks', sound: 'sound', event: 'events',
                control: 'control', sensing: 'sensing', operator: 'operators',
                data: 'variables', procedures: 'myBlocks', argument: 'myBlocks'
            }[seg];
            if (key) {
                var cat = CAT_BY_KEY[key];
                return { bucket: 'core', key: key, name: cat.name, color: cat.color, seg: null };
            }
            var ext = extMeta(seg);
            return { bucket: 'ext', key: 'ext:' + seg, name: ext.name, color: ext.color, seg: seg };
        }

        // 概念难度 1–4 与外观/算法倾向 -1~1，用于分布趋势图坐标系
        function opcodeProfile(op) {
            var d = 2, s = 0;
            if (op.indexOf('motion_') === 0) { d = 1; s = -0.35; }
            else if (op.indexOf('looks_') === 0) { d = 1; s = -0.9; }
            else if (op.indexOf('sound_') === 0) { d = 1; s = -0.75; }
            else if (op.indexOf('event_') === 0) { d = 1; s = -0.5; }
            else if (op.indexOf('control_') === 0) {
                d = 2; s = 0.1;
                if (op === 'control_wait') { d = 1; s = 0; }
                if (op === 'control_create_clone_of' || op === 'control_start_as_clone' ||
                    op === 'control_delete_this_clone') { d = 3; s = 0.4; }
                if (op === 'control_repeat_until' || op === 'control_wait_until') { d = 3; s = 0.3; }
            }
            else if (op.indexOf('sensing_') === 0) {
                d = 2; s = 0.25;
                if (op === 'sensing_of') d = 3;
                if (op === 'sensing_current' || op === 'sensing_dayssince2000') d = 2;
            }
            else if (op.indexOf('operator_') === 0) {
                d = 3; s = 0.9;
                if (op === 'operator_join' || op === 'operator_length' ||
                    op === 'operator_letter_of' || op === 'operator_contains') { d = 2; s = 0.7; }
                if (op === 'operator_random') { d = 2; s = 0.6; }
                if (op === 'operator_mod' || op === 'operator_round' || op === 'operator_mathop') { d = 4; s = 0.95; }
            }
            else if (op.indexOf('data_') === 0) {
                d = 2; s = 0.75;
                if (op === 'data_variable' || op === 'data_setvariableto' || op === 'data_changevariableby') { d = 2; s = 0.7; }
                if (op.indexOf('list') !== -1) { d = 3; s = 0.85; }
            }
            else if (op.indexOf('procedures_') === 0 || op.indexOf('argument_') === 0) { d = 4; s = 0.55; }
            else { d = 2; s = -0.35; }
            return { diff: d, style: s };
        }

        var DS_DIMS = ['抽象', '并行', '逻辑', '同步', '流控', '交互', '数据'];

        function proficiencyText(score) {
            if (score === 0) return 'NOT DEVELOPED 未发展';
            if (score <= 7) return 'BASIC 基础';

            return 'PROFICIENT 熟通';

        /* ================= 统计计算 ================= */

        // 追踪子栈嵌套深度（用于复杂度统计）
        function substackDepth(block, blocks, visited) {
            if (!block || visited.indexOf(block) !== -1) return 0;
            visited.push(block);
            var maxSub = 0;
            var inputs = block.inputs || {};
            ['SUBSTACK', 'SUBSTACK2'].forEach(function(name) {
                var input = inputs[name];
                if (Array.isArray(input) && input.length >= 2 && typeof input[1] === 'string' && blocks[input[1]]) {
                    var d = substackDepth(blocks[input[1]], blocks, visited) + (name === 'SUBSTACK2' ? 1 : 0);
                    if (d > maxSub) maxSub = d;
                }
            });
            if (typeof block.next === 'string' && blocks[block.next]) {
                var nd = substackDepth(blocks[block.next], blocks, visited);
                if (nd > maxSub) maxSub = nd;
            }
            return maxSub;
        }

        function niceStep(raw) {
            if (raw <= 0) return 1;
            var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
            var f = raw / mag;
            var n = f <= 1 ? 1 : (f <= 2 ? 2 : (f <= 5 ? 5 : 10));
            return n * mag;
        }

        function computeStats(project, payload) {
            var targets = project.targets || [];
            var stage = null;
            var sprites = [];
            targets.forEach(function(t) {
                if (t && t.isStage) stage = t; else sprites.push(t);
            });

            var stats = {
                targetsCount: targets.length,
                spriteCount: sprites.length,
                costumeCount: 0,
                soundCount: 0,
                blockAll: 0, blockReal: 0, blockShadow: 0,
                catCounts: {}, extCounts: {}, 
                opcodeCounts: {},
                varCount: 0, listCount: 0,
                varUsed: {}, listUsed: {},
                variablesBytes: 0, listsBytes: 0,
                bigListCount: 0,
                commentCount: 0,
                scriptCount: 0, emptyScripts: 0,
                signatures: {}, dupGroups: 0,
                longestScript: 0, scriptBlockSum: 0,
                maxDepth: 0,
                loopCount: 0, ifCount: 0, ifElseCount: 0,
                defsCount: 0, callsCount: 0,
                comparisons: 0, boolOps: 0,
                flagHats: 0,
                keyHats: 0, clickHats: 0,
                broadcastSend: 0, broadcastRecv: 0,
                asks: 0, interactiveSensing: 0,
                timerUses: 0, waits: 0,
                multiScriptSprites: 0, flagSpriteCount: 0
            };
            CATS.forEach(function(c) { stats.catCounts[c.key] = 0; });

            var perTargetScriptCounts = [];

            targets.forEach(function(target) {
                if (!target) return;
                stats.costumeCount += (target.costumes || []).length;
                stats.soundCount += (target.sounds || []).length;
                stats.commentCount += Object.keys(target.comments || {}).length;

                var variables = target.variables || {};
                var lists = target.lists || {};
                stats.varCount += Object.keys(variables).length;
                stats.listCount += Object.keys(lists).length;

                var variablesClone = {}, listsClone = {};
                Object.keys(variables).forEach(function(id) { variablesClone[id] = variables[id]; });
                Object.keys(lists).forEach(function(id) { listsClone[id] = lists[id]; });
                stats.variablesBytes += utf8Size(JSON.stringify(variablesClone));
                stats.listsBytes += utf8Size(JSON.stringify(listsClone));

                Object.keys(lists).forEach(function(id) {
                    var entry = lists[id];
                    var items = Array.isArray(entry) ? entry[1] : (entry && entry.value);
                    if (Array.isArray(items) && items.length >= 1000) stats.bigListCount++;
                });

                var blocks = target.blocks || {};
                var scriptCountHere = 0;

                Object.keys(blocks).forEach(function(blockId) {
                    var block = blocks[blockId];
                    if (!block || !block.opcode) return;
                    stats.blockAll++;
                    if (block.shadow) { stats.blockShadow++; return; }
                    stats.blockReal++;

                    var op = block.opcode;
                    stats.opcodeCounts[op] = (stats.opcodeCounts[op] || 0) + 1;

                    var cls = classify(op);
                    if (cls.bucket === 'core') stats.catCounts[cls.key]++;
                    else stats.extCounts[cls.seg] = (stats.extCounts[cls.seg] || 0) + 1;

                    var fields = block.fields || {};
                    var fv = fields.VARIABLE;
                    if (Array.isArray(fv) && fv[0]) stats.varUsed[fv[0]] = true;
                    var fl = fields.LIST;
                    if (Array.isArray(fl) && fl[0]) stats.listUsed[fl[0]] = true;

                    // 能力评分各维度所用积木计数
                    if (op === 'control_repeat' || op === 'control_forever' || op === 'control_repeat_until') stats.loopCount++;
                    if (op === 'control_if') stats.ifCount++;
                    if (op === 'control_if_else') stats.ifElseCount++;
                    if (op === 'control_wait' || op === 'control_wait_until') stats.waits++;
                    if (op === 'procedures_definition' || op === 'procedures_definition_return') stats.defsCount++;
                    if (op === 'procedures_call') stats.callsCount++;
                    if (op === 'operator_equals' || op === 'operator_gt' || op === 'operator_lt') stats.comparisons++;
                    if (op === 'operator_and' || op === 'operator_or' || op === 'operator_not') stats.boolOps++;
                    if (op === 'event_whenflagclicked') stats.flagHats++;
                    if (op === 'event_whenkeypressed') stats.keyHats++;
                    if (op === 'event_whenthisspriteclicked' || op === 'event_whenstageclicked' ||
                        op === 'event_whenquantitychanged') stats.clickHats++;
                    if (op === 'event_whenbroadcastreceived') stats.broadcastRecv++;
                    if (op === 'event_broadcast' || op === 'event_broadcastandwait') stats.broadcastSend++;
                    if (op === 'sensing_askandwait') stats.asks++;
                    if (op === 'sensing_mousedown' || op === 'sensing_keypressed' ||
                        op === 'sensing_loudness') stats.interactiveSensing++;
                    if (op === 'sensing_timer' || op === 'sensing_resettimer') stats.timerUses++;

                    if (block.topLevel) {
                        var chain = [];
                        var current = block;
                        var guard = 0;
                        while (current && guard++ < 100000) {
                            chain.push(current.opcode);
                            if (typeof current.next === 'string' && blocks[current.next]) {
                                current = blocks[current.next];
                            } else break;
                        }
                        stats.scriptCount++;
                        scriptCountHere++;
                        stats.scriptBlockSum += chain.length;
                        if (chain.length > stats.longestScript) stats.longestScript = chain.length;
                        if (chain.length <= 1) stats.emptyScripts++;
                        if (chain.length >= 2) {
                            var sig = chain.join('|');
                            if (stats.signatures[sig]) stats.dupGroups++;
                            else stats.signatures[sig] = true;
                        }
                        var depth = substackDepth(block, blocks, []);
                        if (depth > stats.maxDepth) stats.maxDepth = depth;
                    }
                });

                perTargetScriptCounts.push(scriptCountHere);
            });

            // 并行能力：多脚本角色与绿旗角色
            perTargetScriptCounts.forEach(function(count, index) {
                if (targets[index] && targets[index].isStage) return;
                if (count >= 2) stats.multiScriptSprites++;
            });

            var unusedVars = 0, unusedLists = 0;
            targets.forEach(function(target) {
                Object.keys(target.variables || {}).forEach(function(id) {
                    var entry = target.variables[id];
                    var name = Array.isArray(entry) ? entry[0] : (entry && (entry.name || id));
                    if (name && !stats.varUsed[name]) unusedVars++;
                });
                Object.keys(target.lists || {}).forEach(function(id) {
                    var entry = target.lists[id];
                    var name = Array.isArray(entry) ? entry[0] : (entry && (entry.name || id));
                    if (name && !stats.listUsed[name]) unusedLists++;
                });
            });
            stats.unusedVars = unusedVars;
            stats.unusedLists = unusedLists;

            // 各类别与拓展汇总
            stats.donutSlices = [];
            CATS.forEach(function(c) {
                var count = stats.catCounts[c.key];
                if (count > 0) stats.donutSlices.push({ name: c.name, color: c.color, count: count });
            });
            Object.keys(stats.extCounts).forEach(function(seg) {
                var meta = extMeta(seg);
                stats.donutSlices.push({ name: meta.name, color: meta.color, count: stats.extCounts[seg], seg: seg });
            });
            stats.donutSlices.sort(function(a, b) { return b.count - a.count; });
            if (stats.donutSlices.length > 16) stats.donutSlices = stats.donutSlices.slice(0, 16);

            // Top 10 积木
            stats.top10 = Object.keys(stats.opcodeCounts).map(function(op) {
                var cls = classify(op);
                return { op: op, name: opcodeName(op), count: stats.opcodeCounts[op], color: cls.color };
            }).sort(function(a, b) { return b.count - a.count; }).slice(0, 10);

            // 分布趋势气泡：按积木聚合（难度与倾向由积木族决定）
            var bubbleEntries = Object.keys(stats.opcodeCounts).map(function(op) {
                var cls = classify(op);
                var prof = opcodeProfile(op);
                return {
                    op: op,
                    count: stats.opcodeCounts[op],
                    color: cls.color,
                    name: cls.name,
                    key: cls.key,
                    diff: prof.diff,
                    style: prof.style
                };
            }).sort(function(a, b) { return b.count - a.count; }).slice(0, 60);
            stats.bubbles = bubbleEntries;

            // 能力评分
            var flagSprites = 0;
            perTargetScriptCounts.forEach(function(count, index) {
                if (targets[index] && !targets[index].isStage && count > 0) flagSprites++;
            });
            stats.flagSpriteCount = flagSprites;

            var logicUnits = stats.ifCount + stats.ifElseCount + (stats.comparisons > 0 ? 1 : 0) + (stats.boolOps > 0 ? 1 : 0);
            var syncUnits = stats.broadcastSend + stats.broadcastRecv + stats.waits + stats.timerUses;
            var flowUnits = stats.loopCount + stats.waits;
            var interUnits = stats.keyHats + stats.clickHats + stats.asks + stats.interactiveSensing;
            var dataUnits = stats.varCount + stats.listCount * 2;
            var parallelUnits = stats.multiScriptSprites * 2 + (stats.broadcastRecv > 0 ? 1 : 0) + stats.flagSpriteCount;

            function band(count, t1, t2) {
                if (count <= 0) return 0;
                if (count < t1) return 1;
                if (count < t2) return 2;
                return 3;
            }
            var abstraction = band(stats.defsCount, 3, 8);
            var parallelism = band(parallelUnits, 3, 8);
            var logic = band(logicUnits, 4, 10);
            var sync = band(syncUnits, 5, 12);
            var flow = band(flowUnits, 5, 12);
            var interaction = band(interUnits, 4, 10);
            var dataRep = band(dataUnits, 2, 6);
            stats.dsScores = [abstraction, parallelism, logic, sync, flow, interaction, dataRep];
            stats.dsTotal = stats.dsScores.reduce(function(a, b) { return a + b; }, 0);

            // 体积信息
            var jsonRaw = JSON.stringify(project);
            var jsonBytes = utf8Size(jsonRaw);

            var jsonCompressed = payload.jsonCompressedSize || Math.round(jsonBytes * 0.3);
            var costumeSize = payload.assetCostumeSize != null ? payload.assetCostumeSize : 0;
            var soundSize = payload.assetSoundSize != null ? payload.assetSoundSize : 0;
            var assetTotal = payload.assetSize != null ? payload.assetSize : (costumeSize + soundSize);
            if (costumeSize + soundSize === 0 && assetTotal > 0 && stats.costumeCount + stats.soundCount > 0) {
                costumeSize = Math.round(assetTotal * stats.costumeCount / (stats.costumeCount + stats.soundCount));
                soundSize = assetTotal - costumeSize;
            }
            if (assetTotal < costumeSize + soundSize) assetTotal = costumeSize + soundSize;

            // data: URL 内嵌拓展源码体量
            var embeddedExtBytes = 0;
            var dataUrlMatches = jsonRaw.match(/data:[A-Za-z0-9\-._~\/+;=,]{16,}/g) || [];
            dataUrlMatches.forEach(function(m) { embeddedExtBytes += Math.round(m.length * 0.75); });

            var varsBytes = stats.variablesBytes;
            var listsBytes = stats.listsBytes;
            var restBytes = jsonBytes - embeddedExtBytes - varsBytes - listsBytes;
            if (restBytes < 0) restBytes = 0;

            stats.sizes = {
                jsonBytes: jsonBytes,
                jsonCompressed: jsonCompressed,
                costumeSize: costumeSize,
                soundSize: soundSize,
                assetTotal: assetTotal,
                projectSize: jsonCompressed + assetTotal,
                embeddedExtBytes: embeddedExtBytes,
                varsBytes: varsBytes,
                listsBytes: listsBytes,
                restBytes: restBytes
            };

            return stats;
        }

        function renderHeader(stats) {
            el('headTitle').textContent = stats.projectTitle;

            var metaParts = ['NeoWarp', fmtBytes(stats.sizes.projectSize),

            var now = new Date();

            el('headTime').textContent = '生成于 ' + now.getFullYear() + '-' + pad(now.getMonth() + 1) +
                '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        }

        function statTile(option) {
            var tile = document.createElement('div');
            tile.className = 'tile';
            var label = document.createElement('div');
            label.className = 'tile-label';
            label.textContent = option.label;
            tile.appendChild(label);
            var value = document.createElement('div');
            value.className = 'tile-value';
            value.innerHTML = option.value;
            tile.appendChild(value);
            if (option.progress != null) {
                var bar = document.createElement('div');
                bar.className = 'mini-bar';
                var fill = document.createElement('i');
                fill.style.width = Math.max(0, Math.min(100, option.progress)) + '%';
                bar.appendChild(fill);
                tile.appendChild(bar);
            }
            var sub = document.createElement('div');
            sub.className = 'tile-sub';
            sub.textContent = option.sub;
            tile.appendChild(sub);
            return tile;
        }

        function renderStats(stats) {
            var grid = el('statsGrid');
            grid.innerHTML = '';

            grid.appendChild(statTile({
                label: '积木总数',
                value: stats.blockAll,
                progress: stats.blockAll > 0 ? (stats.blockReal / stats.blockAll) * 100 : 0,
                sub: '有效 ' + stats.blockReal + ' · 隐藏 ' + stats.blockShadow
            }));

            grid.appendChild(statTile({
                label: '角色数量',
                value: stats.spriteCount,
                sub: '舞台 ' + (stats.targetsCount - stats.spriteCount) + ' · 造型 ' + stats.costumeCount
            }));

            var customTotal = stats.defsCount + stats.callsCount;
            grid.appendChild(statTile({
                label: '自定义积木',
                value: customTotal,
                sub: customTotal > 0 ? ('定义 ' + stats.defsCount + ' · 调用 ' + stats.callsCount) : '未使用自定义积木'
            }));

            var extBlockCount = 0;
            Object.keys(stats.extCounts).forEach(function(seg) { extBlockCount += stats.extCounts[seg]; });
            grid.appendChild(statTile({
                label: '拓展数量',
                value: Object.keys(stats.extCounts).length,
                sub: '拓展积木 ' + extBlockCount + ' 个'
            }));

            grid.appendChild(statTile({
                label: '变量 / 列表',
                value: stats.varCount + stats.listCount,
                sub: '变量 ' + stats.varCount + ' · 列表 ' + stats.listCount
            }));

            grid.appendChild(statTile({
                label: '工程大小',
                value: fmtBytes(stats.sizes.projectSize),
                sub: '代码 + 素材(压缩估算)'
            }));

            grid.appendChild(statTile({
                label: '资源占用',
                value: fmtBytes(stats.sizes.assetTotal),
                progress: stats.sizes.projectSize > 0 ? (stats.sizes.assetTotal / stats.sizes.projectSize) * 100 : 0,
                sub: '造型 + 音频'
            }));

            grid.appendChild(statTile({
                label: 'Dr.Scratch 总分',
                value: stats.dsTotal + '<span class="den"> / 21</span>',
                progress: (stats.dsTotal / 21) * 100,
                sub: proficiencyText(stats.dsTotal)
            }));
        }

        /* ================= 渲染：分布趋势气泡图 ================= */

        function renderBubble(stats) {
            var svg = el('bubbleChart');
            svg.innerHTML = '';
            var colors = chartColors();
            var entries = stats.bubbles;

            var x0 = 46, x1 = 896;
            var bandW = (x1 - x0) / 4;
            var rows = [
                { label: '外观', y: 42 },
                { label: '平衡', y: 108 },
                { label: '算法', y: 174 }
            ];

            rows.forEach(function(row) {
                svg.appendChild(svgNode('line', {
                    x1: x0, y1: row.y, x2: x1, y2: row.y,
                    stroke: colors.grid, 'stroke-width': 1
                }));
                var text = svgNode('text', {
                    x: x0 - 10, y: row.y + 4, 'text-anchor': 'end',
                    'font-size': 12, fill: colors.label
                });
                text.textContent = row.label;
                svg.appendChild(text);
            });

            var ticks = ['基础', '初级', '中级', '高级'];
            ticks.forEach(function(tick, index) {
                var text = svgNode('text', {
                    x: x0 + (index + 0.5) * bandW, y: 212, 'text-anchor': 'middle',
                    'font-size': 12, fill: colors.tick
                });
                text.textContent = tick;
                svg.appendChild(text);
            });

            var axis = svgNode('text', {
                x: (x0 + x1) / 2, y: 240, 'text-anchor': 'middle',
                'font-size': 12.5, 'font-weight': 600, fill: colors.axis
            });
            axis.textContent = '概念理解难度 →';
            svg.appendChild(axis);

            if (entries.length === 0) {
                var empty = svgNode('text', {
                    x: (x0 + x1) / 2, y: 112, 'text-anchor': 'middle',
                    'font-size': 13, fill: colors.label
                });
                empty.textContent = '暂无积木';
                svg.appendChild(empty);
                return;
            }

            var maxCount = entries[0].count;
            entries.forEach(function(entry) {
                var band = Math.max(1, Math.min(4, entry.diff)) - 1;
                var rowIndex = entry.style <= -0.3 ? 0 : (entry.style >= 0.35 ? 2 : 1);
                var jx = hash01(entry.op);
                var jy = hash01(entry.op + '#y');
                var x = x0 + (band + 0.10 + jx * 0.80) * bandW;
                var y = rows[rowIndex].y + (jy - 0.5) * 46;
                var r = 3 + Math.sqrt(entry.count / maxCount) * 11;
                svg.appendChild(svgNode('circle', {
                    cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(1),
                    fill: entry.color, 'fill-opacity': 0.72
                }));
            });

            // 图例：核心类别在前，拓展跟后
            var legend = el('bubbleLegend');
            var seen = {};
            var items = [];
            CATS.forEach(function(c) { seen[c.key] = false; });
            entries.forEach(function(entry) {
                if (!seen[entry.key]) {
                    seen[entry.key] = true;
                    items.push({ name: entry.name, color: entry.color });
                }
            });
            var html = items.slice(0, 12).map(function(item) {
                return '<div class="item"><div class="dot" style="background:' + item.color + '"></div>' +
                    '<span>' + escapeHtml(item.name) + '</span></div>';
            }).join('');
            legend.innerHTML = html;
        }

        /* ================= 渲染：能力雷达图 ================= */

        function renderRadar(stats) {
            var svg = el('radarChart');
            svg.innerHTML = '';
            var colors = chartColors();

            var cx = 160, cy = 152, R = 100;
            function point(angle, radius) {
                var rad = angle * Math.PI / 180;
                return [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
            }
            function ringPolygon(level) {
                var pts = [];
                DS_DIMS.forEach(function(label, index) {
                    var angle = -90 + index * (360 / DS_DIMS.length);
                    var p = point(angle, R * level / 3);
                    pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
                });
                svg.appendChild(svgNode('polygon', {
                    points: pts.join(' '), fill: 'none',
                    stroke: colors.ring, 'stroke-width': 1
                }));
            }
            ringPolygon(1); ringPolygon(2); ringPolygon(3);

            DS_DIMS.forEach(function(label, index) {
                var angle = -90 + index * (360 / DS_DIMS.length);
                var p = point(angle, R);
                svg.appendChild(svgNode('line', {
                    x1: cx, y1: cy, x2: p[0].toFixed(1), y2: p[1].toFixed(1),
                    stroke: colors.ring, 'stroke-width': 1
                }));
            });

            var dataPts = [];
            stats.dsScores.forEach(function(score, index) {
                var angle = -90 + index * (360 / DS_DIMS.length);
                var p = point(angle, R * score / 3);
                dataPts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
                if (score > 0) {
                    svg.appendChild(svgNode('circle', {
                        cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: 3.2,
                        fill: '#0a84ff'
                    }));
                }
            });
            svg.appendChild(svgNode('polygon', {
                points: dataPts.join(' '),
                fill: 'rgba(10,132,255,0.16)', stroke: '#0a84ff',
                'stroke-width': 2, 'stroke-linejoin': 'round'
            }));

            DS_DIMS.forEach(function(label, index) {
                var angle = -90 + index * (360 / DS_DIMS.length);
                var rad = angle * Math.PI / 180;
                var cosV = Math.cos(rad), sinV = Math.sin(rad);
                var lx = cx + (R + 20) * cosV;
                var ly = cy + (R + 20) * sinV;
                var anchor = cosV > 0.3 ? 'start' : (cosV < -0.3 ? 'end' : 'middle');
                var dy = sinV > 0.3 ? 10 : (sinV < -0.3 ? 2 : 4);
                var text = svgNode('text', {
                    x: lx.toFixed(1), y: (ly + dy).toFixed(1), 'text-anchor': anchor,
                    'font-size': 12.5, 'font-weight': 600, fill: colors.axis
                });
                text.textContent = label;
                svg.appendChild(text);
            });
        }

        /* ================= 渲染：代码基因环图 ================= */

        function renderDonut(stats) {
            var svg = el('donutChart');
            svg.innerHTML = '';
            var legend = el('donutLegend');

            var slices = stats.donutSlices;
            var total = stats.blockReal;

            legend.innerHTML = slices.map(function(slice) {
                return '<div class="item">' +
                    '<div class="dot" style="background:' + slice.color + '"></div>' +
                    '<span class="name">' + escapeHtml(slice.name) + '</span>' +
                    '<span class="count">' + slice.count + '</span>' +
                    '</div>';
            }).join('');

            var cx = 100, cy = 100, r = 72, sw = 26;
            if (total <= 0 || slices.length === 0) {
                svg.appendChild(svgNode('circle', {
                    cx: cx, cy: cy, r: r, fill: 'none',
                    stroke: chartColors().empty, 'stroke-width': sw
                }));
                return;
            }

            var circumference = 2 * Math.PI * r;
            var cumulativeAngle = 0;
            slices.forEach(function(slice) {
                var fraction = slice.count / total;
                if (fraction <= 0) return;
                var dash = fraction * circumference;
                var rotate = (cumulativeAngle / circumference) * 360;
                svg.appendChild(svgNode('circle', {
                    cx: cx, cy: cy, r: r, fill: 'none',
                    stroke: slice.color, 'stroke-width': sw,
                    'stroke-dasharray': dash.toFixed(2) + ' ' + (circumference - dash).toFixed(2),
                    transform: 'rotate(' + rotate.toFixed(2) + ' ' + cx + ' ' + cy + ')'
                }));
                cumulativeAngle += dash;
            });
        }

        /* ================= 渲染：Top 10 条形图 ================= */

        function renderTop10(stats) {
            var svg = el('top10Chart');
            svg.innerHTML = '';
            var colors = chartColors();
            var rows = stats.top10;

            if (rows.length === 0) {
                var empty = svgNode('text', {
                    x: 460, y: 120, 'text-anchor': 'middle', 'font-size': 13, fill: colors.label
                });
                empty.textContent = '暂无积木';
                svg.appendChild(empty);
                return;
            }

            var labelW = 128;
            var x0 = labelW + 14;
            var x1 = 852;
            var rowH = 30;
            var barH = 16;
            var plotH = rows.length * rowH;

            var maxCount = rows[0].count;
            var niceMax = niceStep(maxCount);
            var step = niceMax / 5;

            for (var t = 0; t <= 5; t++) {
                var tickValue = step * t;
                var tx = x0 + (tickValue / niceMax) * (x1 - x0);
                svg.appendChild(svgNode('line', {
                    x1: tx.toFixed(1), y1: 4, x2: tx.toFixed(1), y2: plotH + 12,
                    stroke: colors.grid, 'stroke-width': 1
                }));
                var tick = svgNode('text', {
                    x: tx.toFixed(1), y: plotH + 30, 'text-anchor': 'middle',
                    'font-size': 11, fill: colors.tick
                });
                tick.textContent = Number.isInteger(tickValue) ? tickValue : tickValue.toFixed(1);
                svg.appendChild(tick);
            }

            rows.forEach(function(row, index) {
                var y = index * rowH + 6;
                var label = svgNode('text', {
                    x: x0 - 14, y: y + barH / 2 + 4, 'text-anchor': 'end',
                    'font-size': 12, fill: colors.label
                });
                label.textContent = row.name.length > 9 ? row.name.slice(0, 8) + '…' : row.name;
                svg.appendChild(label);

                var barW = Math.max(2, (row.count / niceMax) * (x1 - x0));
                svg.appendChild(svgNode('rect', {
                    x: x0, y: y.toFixed(1), width: barW.toFixed(1), height: barH,
                    rx: barH / 2, ry: barH / 2, fill: row.color, 'fill-opacity': 0.92
                }));

                var value = svgNode('text', {
                    x: 904, y: y + barH / 2 + 4, 'text-anchor': 'end',
                    'font-size': 11.5, fill: colors.tick
                });
                value.textContent = row.count;
                svg.appendChild(value);
            });
        }

        /* ================= 渲染：资源构成 ================= */

        function renderResource(stats) {
            var sizes = stats.sizes;
            var total = sizes.projectSize;
            el('resTotal').textContent = '总体积 ' + fmtBytes(total);

            var others = Math.max(0, total - sizes.costumeSize - sizes.soundSize - sizes.jsonCompressed);
            var segments = [
                { name: '造型', value: sizes.costumeSize, color: '#4C97FF' },
                { name: '音频', value: sizes.soundSize, color: '#CF63CF' },
                { name: '代码与数据', value: sizes.jsonCompressed, color: '#FF8C1A' },
                { name: '其他资源', value: others, color: '#8E8E93' }
            ];

            var stack = el('resStack');
            stack.innerHTML = '';
            segments.forEach(function(seg) {
                if (seg.value <= 0) return;
                var piece = document.createElement('i');
                piece.style.background = seg.color;
                piece.style.width = ((seg.value / total) * 100).toFixed(2) + '%';
                stack.appendChild(piece);
            });

            var rowsHtml = segments.map(function(seg) {
                return '<div class="res-row">' +
                    '<span class="name">' + seg.name + '</span>' +
                    '<span class="val">' + fmtBytes(seg.value) + '</span>' +
                    '<span class="pct">' + fmtPct(seg.value, total) + '</span>' +
                    '<span class="res-bar"><i style="background:' + seg.color +
                    ';width:' + (total > 0 ? Math.min(100, (seg.value / total) * 100) : 0).toFixed(1) + '%"></i></span>' +
                    '</div>';
            }).join('');
            el('resRows').innerHTML = rowsHtml;
        }

        /* ================= 渲染：project.json 内部构成 ================= */

        function renderJSONParts(stats) {
            var sizes = stats.sizes;
            var total = sizes.jsonBytes;
            el('jsonTotal').textContent = fmtBytes(total);

            var rows = [
                {
                    name: '内嵌拓展源码',
                    desc: 'data: URL 里的 JavaScript',
                    value: sizes.embeddedExtBytes,
                    color: '#9AA0AC'
                },
                {
                    name: '变量与列表数据',
                    desc: '变量 ' + fmtBytes(sizes.varsBytes) + ' · 列表 ' + fmtBytes(sizes.listsBytes),
                    value: sizes.varsBytes + sizes.listsBytes,
                    color: '#FF8C1A'
                },
                {
                    name: '积木与其他元数据',
                    desc: '积木、造型/音频索引、注释等',
                    value: sizes.restBytes,
                    color: '#575E75'
                }
            ];

            el('jsonRows').innerHTML = rows.map(function(row) {
                var pct = total > 0 ? (row.value / total) * 100 : 0;
                return '<div class="json-row">' +
                    '<div><div class="name">' + row.name + '</div><div class="desc">' + escapeHtml(row.desc) + '</div></div>' +
                    '<div class="res-bar bar-col"><i style="background:' + row.color + ';width:' + Math.min(100, pct).toFixed(1) + '%"></i></div>' +
                    '<div class="right"><b>' + fmtBytes(row.value) + '</b>  ' + fmtPct(row.value, total) + '</div>' +
                    '</div>';
            }).join('');
        }

        /* ================= 渲染：拓展资源 ================= */

        function renderExtensions(stats) {
            var container = el('extRows');
            var extTotal = 0;
            Object.keys(stats.extCounts).forEach(function(seg) { extTotal += stats.extCounts[seg]; });
            el('extTotal').textContent = '共 ' + Object.keys(stats.extCounts).length + ' 个命名空间';

            if (extTotal === 0) {
                container.innerHTML = '<div class="ext-empty">未使用拓展积木</div>';
                return;
            }

            var items = Object.keys(stats.extCounts).map(function(seg) {
                var meta = extMeta(seg);
                return { name: meta.name, color: meta.color, count: stats.extCounts[seg] };
            }).sort(function(a, b) { return b.count - a.count; });

            container.innerHTML = items.map(function(item) {
                return '<div class="ext-item">' +
                    '<div class="dot" style="background:' + item.color + '"></div>' +
                    '<span class="name">' + escapeHtml(item.name) + '</span>' +
                    '<span class="use"><b>' + item.count + '</b> 个 · ' + fmtPct(item.count, extTotal) + '</span>' +
                    '</div>';
            }).join('');
        }

        /* ================= 渲染：确定性建议 ================= */

        function renderAdvice(stats) {
            var rows = [];

            if (stats.bigListCount > 0) {
                rows.push({ type: 'warn', text: '存在 ' + stats.bigListCount + ' 个列表元素超过 1000 条，会明显拖慢加载与保存。' });
            }
            if (stats.unusedVars + stats.unusedLists > 0) {
                rows.push({ type: 'info', text: '存在 ' + (stats.unusedVars + stats.unusedLists) +
                    ' 个未被积木引用的变量或列表，删除前请确认不是通过输入或拓展动态访问。' });
            }
            if (stats.emptyScripts > 0) {
                rows.push({ type: 'warn', text: '存在 ' + stats.emptyScripts + ' 个空脚本（仅帽子积木），建议删除或补充逻辑。' });
            }
            if (stats.dupGroups > 0) {
                rows.push({ type: 'info', text: '存在 ' + stats.dupGroups + ' 组结构重复的脚本，建议改用自定义积木复用。' });
            }
            if (stats.maxDepth >= 5) {
                rows.push({ type: 'warn', text: '最深脚本嵌套达 ' + stats.maxDepth + ' 层，建议拆分为多个自定义积木。' });
            }
            if (stats.sizes.assetTotal > 10 * 1024 * 1024) {
                rows.push({ type: 'warn', text: '造型与音频体积较大（' + fmtBytes(stats.sizes.assetTotal) + '），压缩后可明显加快加载与保存。' });
            }
            if (rows.length === 0) {
                rows.push({ type: 'ok', text: '未发现确定性问题，项目结构与资源占用处于合理区间。' });
            }

            var colors = { info: 'info', warn: 'warn', ok: 'ok' };
            el('adviceRows').innerHTML = rows.map(function(row) {
                return '<div class="advice-row ' + colors[row.type] + '"><i></i><span>' +
                    escapeHtml(row.text) + '</span></div>';
            }).join('');
        }

        /* ================= 总渲染 ================= */

        function renderAll(stats) {
            renderHeader(stats);
            renderStats(stats);
            renderBubble(stats);
            renderRadar(stats);
            renderDonut(stats);
            renderTop10(stats);
            renderResource(stats);
            renderJSONParts(stats);
            renderExtensions(stats);
            renderAdvice(stats);
        }

        function showError(text) {
            hide(el('loadingState'));
            hide(el('report'));
            show(el('errorState'));
            if (text) el('errorText').textContent = text;
        }

        function analyzeProject(payload) {
            try {
                var project = payload && payload.projectJSON;
                if (typeof project === 'string') project = JSON.parse(project);
                if (!project || !Array.isArray(project.targets)) {
                    showError('无法获取项目数据');
                    return;
                }
                var stats = computeStats(project, payload || {});
                stats.projectTitle = (payload.projectTitle && payload.projectTitle !== 'NeoWarp') ?
                    payload.projectTitle : '未命名项目';
                lastStats = stats;
                renderAll(stats);
                hide(el('loadingState'));
                show(el('report'));
            } catch (error) {
                showError('项目数据分析失败：' + (error && error.message));
            }
        }

        function loadData() {
            if (window.ProjectAnalysisPreload && window.ProjectAnalysisPreload.getProjectData) {
                window.ProjectAnalysisPreload.getProjectData().then(function(result) {
                    if (result && result.projectJSON) analyzeProject(result);
                    else showError();
                }).catch(function() {
                    showError();
                });
            } else {
                setTimeout(function() { showError(); }, 500);
            }
        }

        /* ================= 导出 ================= */

        function initExport() {
            var button = el('exportBtn');
            if (!button) return;
            button.addEventListener('click', function() {
                var report = el('report');
                if (!report || report.style.display === 'none') return;
                if (!window.ProjectAnalysisPreload || !window.html2canvas) return;

                button.disabled = true;
                button.style.opacity = '0.5';

                window.html2canvas(report, {
                    backgroundColor: getComputedStyle(document.body).backgroundColor,
                    scale: 2,
                    useCORS: true,
                    logging: false
                }).then(function(canvas) {
                    return window.ProjectAnalysisPreload.saveImage(canvas.toDataURL('image/png'));
                }).catch(function(error) {
                    console.error('导出失败', error);
                }).finally(function() {
                    button.disabled = false;
                    button.style.opacity = '';
                });
            });
        }

        initTheme();
        loadData();
        initExport();
    })();
    </script>
</body>
